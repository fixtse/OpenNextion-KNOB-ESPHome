name: Wi-Fi persistence regression
on:
  push:
    branches: [main]
    paths:
      - 'my_components/onx_mode_manager/**'
      - 'my_components/onx_app_state/**'
      - 'tests/wifi_stubs/**'
      - 'tests/test_wifi_lifecycle.cpp'
      - 'custom_logic.h'
      - 'my_components/onx_config_web/**'
      - 'tests/test_browser_catalogue.cjs'
      - 'tests/test_selected_metadata.py'
      - 'tests/test_config_web.cjs'
      - 'onx_entity_config.h'
      - 'tests/test_control_state.cpp'
      - 'tests/test_entity_controls.py'
      - 'tests/test_entity_recovery.py'
      - 'custom_logic_entity_sub.h'
      - 'packages/base/input.yaml'
      - 'onx_control_state.h'
      - 'onx_entity_controls.h'
      - 'tests/test_media_state.cpp'
      - 'onx_media_state.h'
      - 'onx_icon_state.h'
      - 'onx_recovery_state.h'
      - 'my_components/onx_icons/**'
      - 'tests/test_icon_state.cpp'
      - 'tests/test_icon_raster.cpp'
      - 'onx_registry_queue.h'
      - 'tests/test_registry_queue.cpp'
      - 'tests/test_registry_persistence.py'
      - 'packages/features/normal_mode/normal_mode_scripts.yaml'
      - '.github/workflows/wifi-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production mode manager across simulated power cycles
        run: |
          c++ -std=c++17 -Itests/wifi_stubs tests/test_wifi_lifecycle.cpp \
            my_components/onx_mode_manager/onx_mode_manager.cpp \
            my_components/onx_app_state/onx_app_state.cpp -o /tmp/test_wifi_lifecycle
          /tmp/test_wifi_lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test browser-only Home Assistant discovery and authentication
        run: node tests/test_browser_catalogue.cjs
      - name: Test command feedback, option parsing, numeric limits and media state
        run: |
          c++ -std=c++17 tests/test_control_state.cpp -o /tmp/test_control_state
          /tmp/test_control_state
          python3 tests/test_entity_controls.py
          python3 tests/test_entity_recovery.py
          c++ -std=c++17 tests/test_media_state.cpp -o /tmp/test_media_state
          /tmp/test_media_state
          c++ -std=c++17 tests/test_icon_state.cpp -o /tmp/test_icon_state
          /tmp/test_icon_state
          c++ -std=c++17 tests/test_icon_raster.cpp -o /tmp/test_icon_raster
          /tmp/test_icon_raster
      - name: Test registry thread handoff and bounded preference memory
        run: |
          c++ -std=c++17 -pthread tests/test_registry_queue.cpp -o /tmp/test_registry_queue
          /tmp/test_registry_queue
          python3 tests/test_registry_persistence.py
          python3 tests/test_selected_metadata.py
          c++ -std=c++20 -pthread -Itests/http_stubs tests/test_config_http.cpp my_components/onx_config_web/onx_config_web.cpp -o /tmp/test_config_http
          /tmp/test_config_http
      - name: Test web picker saves, actions and mobile layout
        run: bash scripts/test_config_web.sh
      - name: Resume validation thread
        if: ${{ always() }}
        env:
          CALLBACK_URL: ${{ secrets.T3_BUILD_CALLBACK_URL }}
          OUTCOME: ${{ job.status }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request
          url = os.environ['CALLBACK_URL']
          if not url:
              raise SystemExit('Completion callback is not configured')
          payload = dict(task='onx-wifi-regression', status=os.environ['OUTCOME'],
                         revision=os.environ['REVISION'], repository=os.environ['REPOSITORY'],
                         run_id=os.environ['RUN_ID'],
                         log=f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}")
          request = urllib.request.Request(url, data=json.dumps(payload).encode(),
              headers={'User-Agent':'onx-wifi-regression/1.0', 'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print('Completion callback HTTP', response.status)
          except Exception as error:
              print(type(error).__name__, 'HTTP', getattr(error, 'code', 'unknown'))
              raise SystemExit(1)

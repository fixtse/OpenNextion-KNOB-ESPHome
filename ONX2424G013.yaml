substitutions:
  project_name: onx2424g013
  project_friendly_name: ONX2424G013
  # 留空时：normal mode 不强制覆盖 STA，优先使用 captive_portal 保存的配网信息。
  # 若希望固化网络，可直接填写为与 Home Assistant 同一局域网的 Wi-Fi。
  wifi_ssid: ""
  wifi_password: ""
  ap_password: ""
  logger_level: INFO
  uart_baud: "921600"
  standby_timeout_seconds: "300"
  diagnostics_update_interval: 15s
  display_update_interval: 200ms
  lcd_spi_data_rate: 40MHz
  lcd_backlight_default: 100%
  encoder_resolution: "4"
  product_firmware_version: "2026.10.2.36"
  product_firmware_manifest_url: "https://raw.githubusercontent.com/fixtse/esp-ota/main/ota/releases/onx2424g013_manifest.yml"

packages:
  device: !include packages/base/device.yaml
  connectivity: !include packages/base/connectivity.yaml
  display: !include packages/base/display.yaml
  input: !include packages/base/input.yaml
  diagnostics: !include packages/base/diagnostics.yaml
  mode_router: !include packages/features/mode_router.yaml
  boot_status: !include packages/features/boot_status.yaml
  normal_mode: !include packages/features/normal_mode.yaml

preferences:
  flash_write_interval: 5s

esphome:
  includes:
    - onx_memory.h
    - onx_render.h
    - onx_navigation.h
    - onx_notification.h
    - onx_gesture.h
    - onx_runtime_diagnostics.h
    - onx_config_rules.h
    - onx_timer_state.h
    - onx_control_state.h
    - onx_icon_state.h
    - onx_recovery_state.h
    - onx_playlist.h
    - onx_media_state.h
    - onx_registry_queue.h
    - custom_logic.h
    - onx_sensor_view.h
    - custom_logic_entity_sub.h
    - onx_entity_controls.h
    - onx_detail_view.h
    - onx_sensor_graph.h
    - onx_display_settings.h
    - onx_entity_config.h
  name: ${project_name}
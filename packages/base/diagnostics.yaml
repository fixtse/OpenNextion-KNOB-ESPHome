debug:
  update_interval: ${diagnostics_update_interval}

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    id: uptime_seconds
    internal: true
    update_interval: 60s

  - platform: debug
    free:
      id: heap_free
      internal: true
    block:
      id: heap_block
      internal: true
    fragmentation:
      id: heap_fragmentation
      internal: true
    psram:
      id: psram_free
      internal: true
    loop_time:
      id: main_loop_time
      internal: true

interval:
  - interval: ${diagnostics_update_interval}
    then:
      - logger.log:
          level: INFO
          tag: sys
          format: "heap=%.1fKB block=%.1fKB frag=%.1f pct psram=%.1fKB loop=%.0fms"
          args:
            - "id(heap_free).state / 1024.0f"
            - "id(heap_block).state / 1024.0f"
            - "id(heap_fragmentation).state"
            - "id(psram_free).state / 1024.0f"
            - "id(main_loop_time).state"

button:
  - platform: restart
    id: restart_device
    name: "Restart device"
    disabled_by_default: false
    entity_category: config
  - platform: factory_reset
    id: reset_device
    name: "Reset device"
    disabled_by_default: false
    icon: mdi:restore
    entity_category: config

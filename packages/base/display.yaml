spi:
  id: bus_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO6
    frequency: 10000Hz

light:
  - platform: monochromatic
    id: lcd_backlight
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    flash_transition_length: 0s
    internal: true

# Font paths are relative to this package. Include Latin accents explicitly;
# ESPHome's default GF_Latin_Kernel omits characters such as the é in Beyoncé.
# Only text-sized fonts get the extended set; large clock fonts remain compact.
font:
  - file: "../../fonts/MiSans-Bold.ttf"
    id: fonts_MiSans_Bold_12
    size: 12
    bpp: 8
    glyphsets: &text_glyphsets
      - GF_Latin_Kernel
      - GF_Latin_Core
    extras: &text_emoji
      - file: "../../fonts/NotoEmoji.ttf"
        # Single-codepoint monochrome emoji; keep the subset bounded for flash.
        glyphs:
          - "❤☀☁☂☕❄⚡✅❌⭐🌙🌞🌧🌡🌈🎵🎶🎧🎤🎸🎹🎷🎺🎻🥁📻💿📀🔊🔇🔔🔥💡🏠😀😊😂😍😎😢😭👍👏💙💚💛💜🎉"
  - file: "../../fonts/MiSans-Bold.ttf"
    id: fonts_MiSans_Bold_14
    size: 14
    bpp: 8
    glyphsets: *text_glyphsets
    extras: *text_emoji
  - file: "../../fonts/MiSans-Bold.ttf"
    id: fonts_MiSans_Bold_16
    size: 16
    bpp: 8
    glyphsets: *text_glyphsets
    extras: *text_emoji

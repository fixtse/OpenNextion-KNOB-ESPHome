binary_sensor:
  - platform: onx_button
    id: key_btn
    internal: true
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - if:
            condition:
              lambda: return onx_notification::current.visible;
            then:
              - lambda: |-
                  onx_notification::press_consumed=true;
                  id(key_press_started_ms)=id(key_btn).event_time_ms();
                  id(key_pressed)=false;
                  id(normal_clear_wifi_allowed)=false;
                  id(key_long_press_handled)=true;
                  id(ui_presenter)->notify_user_activity();
            else:
              - logger.log: "KEY press"
              - lambda: |-
                  id(key_press_started_ms) = id(key_btn).event_time_ms();
                  id(key_pressed) = true;
                  id(key_long_press_handled) = false;
                  id(detail_long_press_exit_fired) = false;
                  id(normal_clear_wifi_allowed) = true;
                  if (id(screen_off_state)) {
                    id(ha_screen_off).turn_off();
                    id(key_long_press_handled) = true;
                  }
                  if (!id(sleep_mode_state) && id(ui_presenter)->is_standby_active()) {
                    id(standby_wakeup_pending) = true;
                    id(standby_input_suppressed_until_ms) = millis() + 350;
                    id(key_long_press_handled) = true;
                  }
              - lambda: |-
                  if (!id(key_long_press_handled) &&
                      !id(screen_off_state) &&
                      id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() &&
                      !(id(mode_manager)->is_provisioning_mode_enabled() || !id(normal_ha_added)) &&
                      id(normal_device_detail_active) &&
                      id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT &&
                      id(normal_detail_light_mode_count) > 0 &&
                      id(normal_device_detail_online)) {
                    id(normal_detail_light_mode_adjusting) = false;
                    id(normal_detail_light_mode_rotated) = false;
                    id(normal_clear_wifi_allowed) = true;
                  }
              - if:
                  condition:
                    lambda: |-
                      return !id(key_long_press_handled) &&
                             !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !(id(mode_manager)->is_provisioning_mode_enabled() || !id(normal_ha_added)) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT &&
                             id(normal_detail_light_mode_count) > 0 &&
                             id(normal_device_detail_online);
                  then:
                    - script.execute: refresh_normal_light_detail_page
                    - script.execute: enter_normal_light_detail_mode_switching
              - lambda: |-
                  id(ui_presenter)->notify_user_activity();
    on_release:
      then:
        - if:
            condition:
              lambda: return onx_notification::press_consumed || onx_notification::current.visible;
            then:
              - lambda: |-
                  const bool dismiss=onx_notification::press_consumed;
                  onx_notification::press_consumed=false;
                  if(dismiss)onx_notification::current.dismiss();
                  id(key_pressed)=false;
                  id(key_long_press_handled)=true;
                  id(ui_presenter)->notify_user_activity();
                  id(refresh_normal_message_popup).execute();
            else:
              - logger.log:
                  level: INFO
                  format: "KEY release"
              - lambda: |-
                  if (id(sleep_mode_state)) {
                    id(sleep_wakeup_pending) = true;
                    id(standby_wakeup_pending) = false;
                    return;
                  }
                  if (id(standby_wakeup_pending)) {
                    id(exit_standby_mode).execute();
                    id(standby_wakeup_pending) = false;
                    return;
                  }
                  const uint32_t now = id(key_btn).event_time_ms();
                  const uint32_t held_ms = now - id(key_press_started_ms);
                  ESP_LOGI("input", "KEY held for %u ms", static_cast<unsigned int>(held_ms));
                  if (now - id(key_last_release_ms) < 400) {
                    if (id(normal_device_detail_online)) {
                      if (id(screen_off_state)) {
                        id(ha_screen_off).turn_off();
                      } else if (id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && id(normal_page_index) == 4 && id(ha_light_active)) {
                        id(ha_light_selected_slider) = !id(ha_light_selected_slider);
                      }
                    }
                  }
                  id(key_last_release_ms) = now;
                  id(normal_clear_wifi_allowed) = true;
                  if (id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() &&
                      id(mode_manager)->is_provisioning_mode_enabled()) {
                    id(key_long_press_handled) = true;
                    return;
                  }
                  const int pressed_kind = id(normal_device_detail_kind);
                  const bool entity_detail_page = pressed_kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
                      pressed_kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT || pressed_kind == NORMAL_DEVICE_DETAIL_KIND_PLUG ||
                      pressed_kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN || pressed_kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION;
                  const auto pressed_entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
                  auto *pressed_detail = custom_logic_entity_sub::entity_detail(pressed_entity);
                  if (!id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_online) && id(normal_ha_api_connected)) {
                    const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), pressed_entity);
                    if (list != nullptr && onx_playlist::medium_press(held_ms)) {
                      custom_logic_entity_sub::select_control_entity(pressed_entity);
                      onx_playlist::browser.toggle(pressed_entity);
                      id(key_long_press_handled) = true;
                    } else if (list != nullptr && onx_playlist::browser.open &&
                               onx_playlist::browser.entity == pressed_entity && held_ms < onx_playlist::OPEN_MS) {
                      auto &browser = onx_playlist::browser;
                      if (browser.selected >= 0 && browser.selected < list->count) {
                        id(emit_normal_playlist_action).execute(std::string(list->entries[browser.selected].action));
                        browser.clear();
                      }
                      id(key_long_press_handled) = true;
                    }
                    if (id(key_long_press_handled)) id(refresh_normal_playlist).execute();
                  }
                  if (held_ms < 688 && !id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_online) && id(normal_ha_api_connected) &&
                      pressed_entity.rfind("weather.", 0) == 0 && pressed_detail != nullptr) {
                    pressed_detail->weather_page = 2;
                    id(request_normal_weather_forecast).execute(pressed_entity, true);
                    id(key_long_press_handled) = true;
                    id(refresh_normal_automation_detail_page).execute();
                  }
                  if (held_ms < 688 && !id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_ha_api_connected) && (!id(normal_device_detail_online) ||
                      pressed_detail == nullptr || !pressed_detail->received || !pressed_detail->available)) {
                    id(retry_normal_entity_state).execute();
                    id(key_long_press_handled) = true;
                  }
                  if(held_ms<688 && !id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
                      id(normal_device_detail_active) && entity_detail_page && id(normal_device_detail_online) &&
                      id(normal_ha_api_connected) && pressed_entity.rfind("climate.",0)==0 &&
                      !onx_entity_config::action_for_ui(id(normal_device_detail_index)).empty()) {
                    id(emit_configured_press_action).execute(id(normal_device_detail_index));
                    id(key_long_press_handled)=true;
                  }
                  if (held_ms < 688 && !id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_online) && id(normal_ha_api_connected) &&
                      onx_controls::handles(pressed_entity) &&
                      (pressed_entity.rfind("media_player.", 0) != 0 || !custom_logic_entity_sub::control_preview.empty())) {
                    onx_controls::press(pressed_entity);
                    id(key_long_press_handled) = true;
                    id(refresh_normal_automation_detail_page).execute();
                  }
                  if (held_ms < 688 && !id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_online) && id(normal_ha_api_connected) &&
                      pressed_entity.rfind("media_player.", 0) == 0 && pressed_detail != nullptr) {
                    if (onx_media::has_playback(pressed_detail->state)) onx_controls::press(pressed_entity);
                    else {
                      const auto action = onx_entity_config::action_for_ui(id(normal_device_detail_index));
                      if(action=="open_playlists") {
                        const auto *list=onx_entity_config::playlists_for_ui(id(normal_device_detail_index),pressed_entity);
                        if(list!=nullptr) {
                          onx_playlist::browser.toggle(pressed_entity);
                          id(refresh_normal_playlist).execute();
                        } else ESP_LOGW("input","No playlists configured for %s",pressed_entity.c_str());
                      } else if (action.rfind("script.", 0) == 0 || action.rfind("automation.", 0) == 0)
                        id(emit_configured_press_action).execute(id(normal_device_detail_index));
                    }
                    id(key_long_press_handled) = true;
                    id(refresh_normal_automation_detail_page).execute();
                  }
                  if (!id(key_long_press_handled) && !id(detail_long_press_exit_fired) &&
                      !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                      !id(normal_device_detail_curtain_adjust_active) &&
                      !id(ui_presenter)->is_standby_active() && id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_index) >= 0 && id(normal_ha_api_connected) &&
                      pressed_entity.rfind("climate.", 0) != 0 &&
                      !onx_entity_config::action_for_ui(id(normal_device_detail_index)).empty()) {
                    const bool adjustable_light = id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT &&
                                                  id(normal_detail_light_mode_count) > 0;
                    if (held_ms < (adjustable_light ? 300u : 688u)) {
                      id(emit_configured_press_action).execute(id(normal_device_detail_index));
                      id(key_long_press_handled) = true;
                    }
                  }
                  if (id(normal_device_detail_active) && entity_detail_page &&
                      id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
                    if (id(normal_detail_light_mode_count) > 0) {
                      id(normal_detail_light_mode_adjusting) = false;
                      id(normal_detail_light_mode_rotated) = false;
                    }
                    id(refresh_normal_light_detail_page).execute();
                  }
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(detail_long_press_exit_fired) &&
                             (!id(key_long_press_handled) || id(normal_device_detail_curtain_adjust_active)) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN &&
                             (id(normal_device_detail_online) || (id(key_btn).event_time_ms() - id(key_press_started_ms)) >= 688);
                  then:
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_device_detail_online) &&
                                   id(normal_device_detail_curtain_adjust_active);
                        then:
                          - lambda: |-
                              int detail_index = id(normal_device_detail_index);
                              if (detail_index < 0) detail_index = 0;
                              if (detail_index > 19) detail_index = 19;
                              const int target_position = std::clamp(id(normal_device_detail_curtain_target_position), 0, 100);
                              id(normal_device_detail_curtain_adjust_active) = false;
                              id(normal_device_detail_curtain_adjust_pending) = false;
                              id(detail_long_press_exit_fired) = true;
                              id(key_long_press_handled) = true;
                              ESP_LOGI("input", "curtain detail position adjust commit: index=%d target_position=%d", detail_index, target_position);
                          - script.execute: commit_normal_curtain_position_detail
                          - script.execute: refresh_normal_curtain_detail_page
                          - lambda: |-
                              id(ui_presenter)->notify_user_activity();
                        else:
                          - if:
                              condition:
                                lambda: |-
                                  return (id(key_btn).event_time_ms() - id(key_press_started_ms)) >= 688;
                              then:
                                - script.execute: exit_normal_switch_detail
                                - lambda: |-
                                    id(detail_long_press_exit_fired) = true;
                                    id(key_long_press_handled) = true;
                                    id(ui_presenter)->notify_user_activity();
                              else:
                                - lambda: |-
                                    int detail_index = id(normal_device_detail_index);
                                    if (detail_index < 0) detail_index = 0;
                                    if (detail_index > 19) detail_index = 19;
                                    const int feedback_position = std::clamp(id(normal_device_detail_curtain_feedback_position), 0, 100);
                                    const uint32_t curtain_state_code = id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 2);
                                    const int preset_position = std::clamp((int) id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 3), 0, 100);
                                    const bool is_moving = curtain_state_code == 3 || curtain_state_code == 4;
                                    const bool is_at_open = feedback_position == 0;
                                    const bool is_at_closed = feedback_position == 100;
                                    const int target_position = is_moving
                                                                    ? feedback_position
                                                                    : (is_at_open ? 100 : (is_at_closed ? 0 : preset_position));
                                    id(normal_device_detail_curtain_target_position) = target_position;
                                    std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
                                    ESP_LOGI("input", "curtain detail short press: pause/stop, held_ms=%u, index=%d, entity_id=%s",
                                             static_cast<unsigned int>(id(key_btn).event_time_ms() - id(key_press_started_ms)),
                                             detail_index,
                                             entity_id.c_str());
                                    if (entity_id.empty()) {
                                      ESP_LOGW("input", "curtain detail pause skipped: empty entity_id");
                                    }
                                    ESP_LOGI("input", "curtain detail short press action=%s target_position=%d state_code=%u feedback_position=%d",
                                             is_moving ? "stop" : "set", id(normal_device_detail_curtain_target_position),
                                             static_cast<unsigned int>(curtain_state_code), feedback_position);
                                    if (!is_moving && is_at_open) {
                                      ESP_LOGI("input", "curtain detail short press edge override: open -> close");
                                    } else if (!is_moving && is_at_closed) {
                                      ESP_LOGI("input", "curtain detail short press edge override: closed -> open");
                                    }
                                - if:
                                    condition:
                                      lambda: |-
                                        int detail_index = id(normal_device_detail_index);
                                        if (detail_index < 0) detail_index = 0;
                                        if (detail_index > 19) detail_index = 19;
                                        return !id(ui_presenter)->get_normal_device_entity_id(detail_index).empty();
                                    then:
                                      - if:
                                          condition:
                                            lambda: |-
                                              int detail_index = id(normal_device_detail_index);
                                              if (detail_index < 0) detail_index = 0;
                                              if (detail_index > 19) detail_index = 19;
                                              const uint32_t curtain_state_code = id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 2);
                                              return curtain_state_code == 3 || curtain_state_code == 4;
                                          then:
                                            - homeassistant.service:
                                                service: cover.stop_cover
                                                data_template:
                                                  entity_id: "{{ target_entity_id }}"
                                                variables:
                                                  target_entity_id: !lambda |-
                                                    int detail_index = id(normal_device_detail_index);
                                                    if (detail_index < 0) detail_index = 0;
                                                    if (detail_index > 19) detail_index = 19;
                                                    return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                                            - script.execute: show_normal_action_sent
                                          else:
                                            - homeassistant.service:
                                                service: cover.set_cover_position
                                                data_template:
                                                  entity_id: "{{ target_entity_id }}"
                                                  position: "{{ target_position }}"
                                                variables:
                                                  target_entity_id: !lambda |-
                                                    int detail_index = id(normal_device_detail_index);
                                                    if (detail_index < 0) detail_index = 0;
                                                    if (detail_index > 19) detail_index = 19;
                                                    return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                                                  target_position: !lambda |-
                                                    int detail_index = id(normal_device_detail_index);
                                                    if (detail_index < 0) detail_index = 0;
                                                    if (detail_index > 19) detail_index = 19;
                                                    const int feedback_position = std::clamp(id(normal_device_detail_curtain_feedback_position), 0, 100);
                                                    const uint32_t curtain_state_code = id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 2);
                                                    const int preset_position = std::clamp((int) id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 3), 0, 100);
                                                    const bool is_moving = curtain_state_code == 3 || curtain_state_code == 4;
                                                    if (is_moving) {
                                                      return feedback_position;
                                                    }
                                                    if (feedback_position == 0) {
                                                      return 100;
                                                    }
                                                    if (feedback_position == 100) {
                                                      return 0;
                                                    }
                                                    return preset_position;
                                            - script.execute: show_normal_action_sent
                                - lambda: |-
                                    id(key_long_press_handled) = true;
                                    id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_online) &&
                             (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
                              id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT ||
                              id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG ||
                              id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION);
                  then:
                    - lambda: |-
                        const uint32_t held_ms = id(key_btn).event_time_ms() - id(key_press_started_ms);
                        const int kind = id(normal_device_detail_kind);
                        if (kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH || kind == NORMAL_DEVICE_DETAIL_KIND_PLUG) {
                          if (held_ms < 688) {
                            id(emit_normal_switch_control_event).execute();
                          } else {
                            id(normal_detail_exit_switch_ready) = true;
                            id(normal_detail_exit_light_ready) = false;
                          }
                        } else if (kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
                          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
                          const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity);
                          if (list != nullptr && held_ms >= onx_playlist::BACK_MS) {
                            id(normal_detail_exit_switch_ready) = true;
                            id(normal_detail_exit_light_ready) = false;
                          } else if (list != nullptr && held_ms >= onx_playlist::OPEN_MS) {
                            // The release handler above owns the medium gesture.
                          } else if (held_ms < 688) {
                            id(emit_normal_automation_control_event).execute(id(normal_device_detail_index));
                          } else {
                            id(normal_detail_exit_switch_ready) = true;
                            id(normal_detail_exit_light_ready) = false;
                          }
                        } else if (kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
                          const bool has_adjustable_light_mode = id(normal_detail_light_mode_count) > 0;
                          if (held_ms < 300 || (held_ms < 688 && !has_adjustable_light_mode)) {
                            id(emit_normal_switch_control_event).execute();
                          } else if (held_ms < 688) {
                            id(normal_detail_light_mode_adjusting) = false;
                            id(normal_clear_wifi_allowed) = true;
                          } else {
                            id(normal_detail_exit_light_ready) = true;
                            id(normal_detail_exit_switch_ready) = false;
                          }
                        }
                    - script.execute: can_exit_normal_detail
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_detail_exit_allowed);
                        then:
                          - script.execute: exit_normal_switch_detail
                          - lambda: |-
                              id(detail_long_press_exit_fired) = true;
                              id(key_long_press_handled) = true;
                              id(ui_presenter)->notify_user_activity();
                        else:
                          - lambda: |-
                              id(key_long_press_handled) = true;
                              id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS;
                  then:
                    - if:
                        condition:
                          lambda: |-
                            const uint32_t held_ms = id(key_btn).event_time_ms() - id(key_press_started_ms);
                            if (held_ms >= 688) {
                              id(normal_detail_exit_settings_ready) = true;
                              id(normal_detail_exit_switch_ready) = false;
                              id(normal_detail_exit_light_ready) = false;
                              return true;
                            }
                            id(normal_detail_exit_settings_ready) = false;
                            return false;
                        then:
                          - script.execute: can_exit_normal_detail
                          - if:
                              condition:
                                lambda: |-
                                  return id(normal_detail_exit_allowed);
                              then:
                                - script.execute: exit_normal_switch_detail
                                - lambda: |-
                                    id(detail_long_press_exit_fired) = true;
                                    id(key_long_press_handled) = true;
                                    id(ui_presenter)->notify_user_activity();
                              else:
                                - lambda: |-
                                    ESP_LOGW("input", "settings brightness detail exit denied");
                        else:
                          - script.execute: exit_normal_settings_brightness_detail
                    - lambda: |-
                        id(key_long_press_handled) = true;
                        id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() && !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION;
                  then:
                    - lambda: |-
                        custom_logic_entity_sub::cancel_controls();
                        custom_logic::disconnect_all_clients_for_refresh(id(api_server));
                        id(key_long_press_handled) = true;
                        id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB;
                  then:
                    - if:
                        condition:
                          lambda: |-
                            const uint32_t held_ms = id(key_btn).event_time_ms() - id(key_press_started_ms);
                            if (held_ms >= 688) {
                              id(normal_detail_exit_settings_ready) = true;
                              id(normal_detail_exit_switch_ready) = false;
                              id(normal_detail_exit_light_ready) = false;
                              return true;
                            }
                            id(normal_detail_exit_settings_ready) = false;
                            return false;
                        then:
                          - script.execute: can_exit_normal_detail
                          - if:
                              condition:
                                lambda: |-
                                  return id(normal_detail_exit_allowed);
                              then:
                                - script.execute: exit_normal_switch_detail
                                - lambda: |-
                                    id(detail_long_press_exit_fired) = true;
                                    id(key_long_press_handled) = true;
                                    id(ui_presenter)->notify_user_activity();
                              else:
                                - lambda: |-
                                    ESP_LOGW("input", "settings knob detail exit denied");
                        else:
                          - script.execute: apply_normal_settings_knob_detail
                    - lambda: |-
                        id(key_long_press_handled) = true;
                        id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI;
                  then:
                    - if:
                        condition:
                          lambda: |-
                            const uint32_t held_ms = id(key_btn).event_time_ms() - id(key_press_started_ms);
                            if (held_ms >= 688) {
                              id(normal_detail_exit_settings_ready) = true;
                              id(normal_detail_exit_switch_ready) = false;
                              id(normal_detail_exit_light_ready) = false;
                              return true;
                            }
                            id(normal_detail_exit_settings_ready) = false;
                            return false;
                        then:
                          - script.execute: can_exit_normal_detail
                          - if:
                              condition:
                                lambda: |-
                                  return id(normal_detail_exit_allowed);
                              then:
                                - script.execute: exit_normal_switch_detail
                                - lambda: |-
                                    id(detail_long_press_exit_fired) = true;
                                    id(key_long_press_handled) = true;
                                    id(ui_presenter)->notify_user_activity();
                              else:
                                - lambda: |-
                                    ESP_LOGW("input", "settings wifi detail exit denied");
                        else:
                          - script.execute: exit_normal_settings_wifi_detail
                    - lambda: |-
                        id(key_long_press_handled) = true;
                        id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS;
                  then:
                    - if:
                        condition:
                          lambda: |-
                            const uint32_t held_ms = id(key_btn).event_time_ms() - id(key_press_started_ms);
                            if (held_ms >= 688) {
                              id(normal_detail_exit_settings_ready) = true;
                              id(normal_detail_exit_switch_ready) = false;
                              id(normal_detail_exit_light_ready) = false;
                              return true;
                            }
                            id(normal_detail_exit_settings_ready) = false;
                            const int selected = id(normal_settings_selected_index);
                            return selected >= 0 && selected <= 3;
                        then:
                          - if:
                              condition:
                                lambda: |-
                                  return id(normal_detail_exit_settings_ready);
                              then:
                                - script.execute: can_exit_normal_detail
                                - if:
                                    condition:
                                      lambda: |-
                                        return id(normal_detail_exit_allowed);
                                    then:
                                      - script.execute: exit_normal_switch_detail
                                      - lambda: |-
                                          id(detail_long_press_exit_fired) = true;
                                          id(key_long_press_handled) = true;
                                          id(ui_presenter)->notify_user_activity();
                                    else:
                                      - lambda: |-
                                          ESP_LOGW("input", "settings detail exit denied");
                              else:
                                - lambda: |-
                                    switch (id(normal_settings_selected_index)) {
                                      case 0: id(enter_normal_settings_connection).execute(); break;
                                      case 1: id(enter_normal_settings_wifi_detail).execute(); break;
                                      case 2: id(enter_normal_settings_brightness_detail).execute(); break;
                                      case 3: id(enter_normal_settings_knob_detail).execute(); break;
                                    }

                    - lambda: |-
                        id(key_long_press_handled) = true;
                        id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_page_index) == 0;
                  then:
                    - if:
                        condition:
                          lambda: |-
                            int total = id(normal_device_count);
                            if (total < 0) total = 0;
                            if (total > 20) total = 20;
                            const int settings_index = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
                            int selected = id(normal_device_selected_index);
                            if (selected < 0) selected = 0;
                            if (selected == settings_index) {
                              return true;
                            }
                            if (total == 0) {
                              return false;
                            }
                            if (selected > total) selected = total - 1;
                            std::string device_type = id(ui_presenter)->get_normal_device_type(selected);
                            return device_type == "switch" || device_type == "plug" ||
                                   device_type == "light" || device_type == "curtain" ||
                                   device_type == "cover" || device_type == "chazuo" || device_type == "liang" ||
                                   device_type == "dimming_light" || device_type == "dimmable_light" ||
                                   device_type == "dimming" || device_type == "automation" ||
                                   device_type == "sensor" || device_type == "binary_sensor" ||
                                   device_type == "climate" || device_type == "script" ||
                                   device_type == "weather" || device_type == "timer" || device_type == "media_player" ||
                                   onx_controls::handles(id(ui_presenter)->get_normal_device_entity_id(selected));
                        then:
                          - script.execute: enter_normal_switch_detail
                          - lambda: |-
                              id(key_long_press_handled) = true;
                              id(ui_presenter)->notify_user_activity();
              - if:
                  condition:
                    lambda: |-
                      return !id(screen_off_state) &&
                             id(ui_presenter)->is_normal_mode_active() &&
                             !id(ui_presenter)->is_standby_active() &&
                             !id(key_long_press_handled) &&
                             id(normal_page_index) == 4 &&
                             !id(ha_light_active) &&
                             (id(key_btn).event_time_ms() - id(key_press_started_ms) < 1000);
                  then:
                    - lambda: |-
                        id(ha_light_active) = true;
              - if:
                  condition:
                    lambda: |-
                      return id(sleep_wakeup_pending);
                  then:
                    - script.execute: exit_sleep_mode
              - lambda: |-
                  id(key_pressed) = false;
              - lambda: |-
                  id(ui_presenter)->notify_user_activity();

  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_off: 5ms
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "BOOT press"
        - lambda: |-
            id(ui_presenter)->notify_user_activity();

interval:
  - interval: 20ms
    then:
      - if:
          condition:
            lambda: |-
              // A popup owns its entire press, even if it expires or is dismissed by HA.
              // Require a normal press timestamp before allowing destructive reset.
              return id(key_btn).state && id(key_btn).is_physically_pressed() && id(key_pressed) &&
                     !onx_notification::current.visible && !onx_notification::press_consumed &&
                     !id(sleep_mode_state) &&
                     !id(standby_wakeup_pending) &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(normal_clear_wifi_allowed) &&
                     (!id(normal_device_detail_active) || id(normal_device_detail_online)) &&
                     (millis() - id(key_press_started_ms) >= 10000);
          then:
            - lambda: |-
                ESP_LOGW("input", "KEY long press reached 10s in normal mode, clearing normal mode config and rebooting");
                if (wifi::global_wifi_component != nullptr) {
                  wifi::global_wifi_component->clear_sta();
                  id(mode_manager)->clear_saved_normal_wifi_prefs_();
                }
                reset_normal_mode_preferences();
                id(ha_host).publish_state("homeassistant.local");
                id(standby_timeout_seconds).publish_state(300);
                id(device1_type).publish_state("Switch");
                id(device2_type).publish_state("Switch");
                id(device3_type).publish_state("Switch");
                id(device4_type).publish_state("Switch");
                id(device5_type).publish_state("Switch");
                id(device6_type).publish_state("Switch");
                id(device7_type).publish_state("Switch");
                id(device8_type).publish_state("Switch");
                id(device9_type).publish_state("Switch");
                id(device10_type).publish_state("Switch");
                id(normal_brightness_value) = 100;
                id(normal_knob_applied_value) = 2;
                id(normal_knob_pending_value) = 2;
                id(normal_ha_added) = false;
                id(normal_ha_api_connected) = false;
                App.safe_reboot();
      - if:
          condition:
            lambda: |-
              return !id(screen_off_state) &&
                     id(key_btn).state && id(key_btn).is_physically_pressed() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     !id(ui_presenter)->is_standby_active() &&
                     !id(detail_long_press_exit_fired) &&
                     !id(key_long_press_handled) &&
                       id(normal_device_detail_active) &&
                       (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_CONNECTION ||
                        id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) &&
                     !(id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN && id(normal_device_detail_curtain_adjust_active)) &&
                     (millis() - id(key_press_started_ms) < 10000);
          then:
            - script.execute: update_normal_detail_exit_ready_flags
            - script.execute: can_exit_normal_detail
            - if:
                condition:
                  lambda: |-
                      return id(normal_detail_exit_allowed);
                then:
                  - script.execute: exit_normal_switch_detail
                  - lambda: |-
                      id(detail_long_press_exit_fired) = true;
                      id(key_long_press_handled) = true;
                      id(ui_presenter)->notify_user_activity();
      - if:
          condition:
            lambda: |-
              return !id(screen_off_state) &&
                     id(key_btn).state && id(key_btn).is_physically_pressed() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     !id(ui_presenter)->is_standby_active() &&
                     id(normal_page_index) == 4 &&
                     id(ha_light_active) &&
                     !id(key_long_press_handled) &&
                     (millis() - id(key_press_started_ms) >= 1000);
          then:
            - lambda: |-
                id(ha_light_active) = false;
                id(key_long_press_handled) = true;
                id(ui_presenter)->notify_user_activity();

sensor:
  - platform: rotary_encoder
    id: knob_enc
    internal: true
    pin_a:
      number: GPIO48
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO47
      mode:
        input: true
        pullup: true
    resolution: ${encoder_resolution}
    on_clockwise:
      then:
        - if:
            condition:
              lambda: return onx_notification::current.visible || onx_notification::press_consumed;
            then:
              - script.execute:
                  id: scroll_normal_message
                  direction: 1
            else:
              - if:
                  condition:
                    lambda: |-
                      if(!id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
                          id(screen_off_state) || id(sleep_mode_state) || id(standby_wakeup_pending) || id(sleep_wakeup_pending) ||
                          id(mode_manager)->is_provisioning_mode_enabled() || !id(normal_device_detail_active) || !id(normal_ha_api_connected) ||
                          onx_timer::popup.visible || onx_playlist::browser.open || id(detail_long_press_exit_fired))return false;
                      return onx_gesture::routes(onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index)),
                          onx_gesture::gesture(1,id(key_btn).state));
                  then:
                    - script.execute:
                        id: queue_normal_gesture
                        direction: 1
                  else:
                    - lambda: |-
                        if (onx_timer::popup.visible) {
                          onx_timer::popup.visible=false;onx_timer::popup.dismissed=true;
                          id(normal_device_selected_index)=onx_timer::popup.previous_index;
                          id(exit_normal_switch_detail).execute();
                        }
                        int threshold = id(normal_knob_applied_value);
                        // Playlist selection follows every encoder detent.
                        if (onx_playlist::browser.open && id(normal_device_detail_active)) threshold = 1;
                        if (threshold != 1 && threshold != 2 && threshold != 4) {
                          threshold = 1;
                        }
                        id(normal_knob_cw_accumulator) = 0;
                        id(normal_knob_ccw_accumulator)++;
                        if (id(normal_knob_ccw_accumulator) >= threshold) {
                          id(normal_knob_ccw_accumulator) = 0;
                          id(normal_knob_event_pass) = true;
                        } else {
                          id(normal_knob_event_pass) = false;
                        }
                    - if:
                        condition:
                          lambda: |-
                            if (!id(sleep_mode_state) && id(ui_presenter)->is_standby_active()) {
                              id(standby_wakeup_pending) = true;
                              id(standby_input_suppressed_until_ms) = millis() + 350;
                            }
                            return id(sleep_mode_state);
                        then:
                          - lambda: |-
                              id(sleep_wakeup_pending) = true;
                    - if:
                        condition:
                          lambda: |-
                            return id(screen_off_state);
                        then:
                          - switch.turn_off: ha_screen_off
                    - lambda: |-
                        if (millis() < id(standby_input_suppressed_until_ms)) {
                          id(normal_knob_event_pass) = false;
                        }
                    - script.execute:
                        id: adjust_normal_entity_control
                        direction: 1
                    - if:
                        condition:
                          lambda: |-
                            return id(ui_presenter)->is_normal_mode_active() &&
                                   !id(ui_presenter)->is_standby_active() &&
                                   id(mode_manager)->is_provisioning_mode_enabled();
                        then:
                          - lambda: |-
                              id(normal_knob_event_pass) = false;
                    - if:
                        condition:
                          lambda: |-
                            int total = id(normal_device_count);
                            if (total < 0) total = 0;
                            if (total > 20) total = 20;
                            const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                   id(normal_page_index) == 0 && id(normal_device_selected_index) < last_selectable;
                        then:
                          - lambda: |-
                              id(normal_device_selected_index) = onx_entity_config::carousel_selection(id(normal_device_selected_index)+1, id(normal_device_count), 1);
                          - script.execute:
                              id: show_normal_device_entry_page
                              direction: 1
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                   id(normal_device_detail_active) && id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SETTINGS;
                        then:
                          - lambda: |-
                              if (id(normal_settings_selected_index) < 3) {
                                id(normal_settings_selected_index)++;
                              }
                              ESP_LOGI("input", "settings detail select: %d", id(normal_settings_selected_index));
                          - script.execute: refresh_normal_settings_detail_page
                          - lambda: |-
                              id(ui_presenter)->notify_user_activity();
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                   id(normal_device_detail_active) && id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN &&
                                   id(normal_device_detail_online) &&
                                   !id(key_btn).state;
                        then:
                          - lambda: |-
                              int detail_index = id(normal_device_detail_index);
                              if (detail_index < 0) detail_index = 0;
                              if (detail_index > 19) detail_index = 19;
                              id(normal_device_detail_curtain_target_position) = 100;
                              ESP_LOGI("input", "curtain detail clockwise: target_position=%d", id(normal_device_detail_curtain_target_position));
                              id(key_long_press_handled) = true;
                              id(ui_presenter)->notify_user_activity();
                          - script.execute: refresh_normal_curtain_detail_page
                          - homeassistant.service:
                              service: cover.set_cover_position
                              data_template:
                                entity_id: "{{ target_entity_id }}"
                                position: "100"
                              variables:
                                target_entity_id: !lambda |-
                                  int detail_index = id(normal_device_detail_index);
                                  if (detail_index < 0) detail_index = 0;
                                  if (detail_index > 19) detail_index = 19;
                                  return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                   id(normal_device_detail_active) &&
                                   id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN &&
                                   id(normal_device_detail_online) &&
                                   id(key_btn).state &&
                                   (millis() - id(key_press_started_ms) < 610) &&
                                   !id(normal_device_detail_curtain_adjust_active);
                        then:
                          - lambda: |-
                              int detail_index = id(normal_device_detail_index);
                              if (detail_index < 0) detail_index = 0;
                              if (detail_index > 19) detail_index = 19;
                              const int feedback_position = std::clamp((int) id(app_storage)->get_normal_ui_device_position(detail_index), 0, 100);
                              id(normal_device_detail_curtain_feedback_position) = feedback_position;
                              id(normal_device_detail_curtain_target_position) = feedback_position;
                              id(normal_device_detail_curtain_adjust_active) = true;
                              id(normal_device_detail_curtain_adjust_pending) = true;
                              id(normal_clear_wifi_allowed) = false;
                              id(key_long_press_handled) = true;
                              int target_position = id(normal_device_detail_curtain_target_position) + 1;
                              if (target_position > 100) target_position = 100;
                              id(normal_device_detail_curtain_target_position) = target_position;
                              ESP_LOGI("input", "curtain detail position adjust entered cw: feedback=%d target=%d", feedback_position, target_position);
                          - script.execute: refresh_normal_curtain_detail_page
                          - lambda: |-
                              id(ui_presenter)->notify_user_activity();
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                    id(normal_device_detail_active) &&
                                   id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_CURTAIN &&
                                   id(normal_device_detail_online) &&
                                   id(normal_device_detail_curtain_adjust_active) &&
                                   !id(normal_device_detail_curtain_adjust_pending) &&
                                   id(key_btn).state;
                        then:
                          - lambda: |-
                              int target_position = id(normal_device_detail_curtain_target_position) + 1;
                              if (target_position > 100) target_position = 100;
                              id(normal_device_detail_curtain_target_position) = target_position;
                              id(key_long_press_handled) = true;
                              id(normal_clear_wifi_allowed) = false;
                              ESP_LOGI("input", "curtain detail position adjust cw: target=%d", target_position);
                          - script.execute: refresh_normal_curtain_detail_page
                          - lambda: |-
                              id(ui_presenter)->notify_user_activity();
                    - if:
                        condition:
                          lambda: |-
                            return id(normal_knob_event_pass) &&
                                   !id(screen_off_state) && id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() && !id(standby_wakeup_pending) &&
                                   id(normal_device_detail_active) &&
                                   id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT &&
                                   id(normal_device_detail_online) &&
                                   id(normal_detail_light_mode_count) > 0 &&
                                   id(key_btn).state &&
                                   (millis() - id(key_press_started_ms) >= 300);
                        then:
                          - lambda: |-
                              id(normal_detail_light_mode_rotated) = true;
                              int detail_index = id(normal_device_detail_index);
                              if (detail_index < 0) detail_index = 0;
                              if (detail_index > 19) detail_index = 19;
                              auto light_state = id(app_storage)->normal_device_slot(detail_index).light();
                              auto is_mode_enabled = [&](int mode) -> bool {
                                if (mode == 0) return light_state.custom_supports_brightness();
                                if (mode == 1) return light_state.custom_supports_color_temperature();
                                if (mode == 2) return light_state.custom_supports_rgb();
                                return false;
                              };
                              for (int candidate = id(normal_detail_light_mode) + 1; candidate < 3; ++candidate) {
                                if (is_mode_enabled(candidate)) {
                                  id(normal_detail_light_mode) = candidate;
                                  break;
                                }

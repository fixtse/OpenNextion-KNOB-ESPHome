# Boot/status pages used before a feature-specific page takes over.

image:
  - platform: file
    file: "../../assets/branding/fixtse-logo.png"
    id: boot_logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 96x90

lvgl:
  pages:
    - id: boot_page
      bg_color: 0x000000
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            src: boot_logo_img
            align: center
            y: -18
        - label:
            align: center
            y: 52
            text_font: fonts_MiSans_Bold_24
            text_color: 0xFFFFFF
            text: "fixtSE"

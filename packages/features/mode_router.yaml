# Local external components host the state machine and protocol logic.
# YAML stays focused on wiring and composition.
external_components:
  - source:
      type: local
      path: ../../my_components
    components:
      - ili9xxx
      - onx_app_state
      - onx_storage
      - onx_mode_manager
      - onx_ui
      - onx_config_web

# Shared runtime state for all future modes.
onx_app_state:
  id: app_state

# Storage abstraction; future versions will back this with NVS/eFuse.
onx_storage:
  id: app_storage

# Central mode router. It enters normal mode after runtime state is initialized.
onx_mode_manager:
  id: mode_manager
  app_state_id: app_state
  normal_wifi_ssid: ${wifi_ssid}
  normal_wifi_password: ${wifi_password}
  runtime_log_level: ${logger_level}

# UI presenter/view-model layer. Keep display business logic centralized in C++
# so YAML focuses on layout and bindings.
onx_ui:
  id: ui_presenter
  app_state_id: app_state
  storage_id: app_storage


onx_config_web:
  id: entity_config_web
  handler: !lambda |-
    if (query.op == "state") return onx_entity_config::state(id(ha_host).state, id(normal_wifi_connected), id(normal_ha_api_connected));
    if (query.op == "settings_state") {
      return esphome::json::build_json([&](JsonObject root) {
        root["brightness"] = std::to_string(std::clamp(id(normal_brightness_value), 10, 100));
        root["standby"] = std::to_string(id(app_storage)->get_standby_timeout_ms() / 1000U);
        root["sensitivity"] = std::to_string(id(normal_knob_applied_value));
        root["sleep_enabled"] = id(ui_presenter)->get_sleep_mode_enabled() ? "1" : "0";
        root["sleep_start"] = id(ui_presenter)->get_sleep_window_start_time().substr(0, 5);
        root["sleep_end"] = id(ui_presenter)->get_sleep_window_end_time().substr(0, 5);
        root["sleep_timeout"] = std::to_string(id(ui_presenter)->get_sleep_timeout_ms() / 1000U);
      });
    }
    if (query.op == "settings") {
      unsigned brightness, standby, sensitivity, sleep_timeout;
      if (!onx_config::integer_in_range(query.brightness, 10, 100, brightness) ||
          !onx_config::integer_in_range(query.standby, 1, 900, standby) ||
          !onx_config::integer_in_range(query.sensitivity, 1, 4, sensitivity) || sensitivity == 3 ||
          !onx_config::integer_in_range(query.sleep_timeout, 1, 3600, sleep_timeout) ||
          (query.sleep_enabled != "0" && query.sleep_enabled != "1") ||
          !onx_config::valid_time(query.sleep_start) || !onx_config::valid_time(query.sleep_end))
        return onx_entity_config::error("Invalid display or sleep settings; check the limits and times");
      const bool enabled = query.sleep_enabled == "1";
      const std::string start = query.sleep_start + ":00", end = query.sleep_end + ":00";
      const uint16_t start_minutes = (start[0] - '0') * 600 + (start[1] - '0') * 60 + (start[3] - '0') * 10 + start[4] - '0';
      const uint16_t end_minutes = (end[0] - '0') * 600 + (end[1] - '0') * 60 + (end[3] - '0') * 10 + end[4] - '0';
      if (!id(app_storage)->set_standby_timeout_ms(standby * 1000U) ||
          !id(app_storage)->set_sleep_mode_config(enabled, start_minutes, end_minutes, sleep_timeout * 1000U))
        return onx_entity_config::error("Could not persist display settings; retry");
      auto standby_call = id(standby_timeout_seconds).make_call();
      standby_call.set_value(standby); standby_call.perform();
      id(ui_presenter)->set_sleep_mode_config(enabled, start, end, sleep_timeout * 1000U);
      id(sleep_mode_enabled).publish_state(enabled);
      id(sleep_mode_start_time).publish_state(start);
      id(sleep_mode_end_time).publish_state(end);
      id(sleep_timeout_seconds).publish_state(sleep_timeout);
      id(normal_knob_applied_value) = sensitivity;
      id(normal_knob_pending_value) = sensitivity;
      id(normal_brightness_value) = brightness;
      auto light_call = id(lcd_backlight)->make_call();
      light_call.set_state(true); light_call.set_brightness(brightness / 100.0f); light_call.perform();
      id(screen_off_state) = false;
      id(ha_display_light_syncing) = true;
      auto ha_call = id(ha_light)->make_call();
      ha_call.set_state(true); ha_call.set_brightness(brightness / 100.0f); ha_call.perform();
      id(ha_display_light_syncing) = false;
      id(ui_presenter)->notify_user_activity();
      return std::string("{\"ok\":true}");
    }
    if (query.op == "weather") {
      if (!query.entity.empty() && (!onx_config::valid_entity(query.entity) || query.entity.rfind("weather.", 0) != 0)) return onx_entity_config::error("Choose a weather entity");
      if (!custom_logic::save_standby_weather_config_entity_id(query.entity) || !onx_entity_config::save_selected_metadata(query))
        return onx_entity_config::error("Could not save standby weather");
      custom_logic::apply_standby_weather_config_options(id(standby_weather_config));
      custom_logic_entity_sub::subscribe_standby_weather_entity(id(api_server), query.entity, &id(standby_weather_entity_id), &id(standby_weather_state), &id(standby_weather_temperature), &id(standby_weather_temperature_unit), &id(standby_weather_humidity));
      return std::string("{\"ok\":true}");
    }
    if (query.op != "save" || query.slot < 0 || query.slot >= 10)
      return onx_entity_config::error("Unknown configuration request");
    if ((!query.entity.empty() && ((!onx_config::valid_entity(query.entity) && !custom_logic::is_local_hmi_gpio_switch_preset_option(query.entity)) ||
          !custom_logic::is_supported_normal_device_entity_id(query.entity.c_str()))) ||
        !onx_config::valid_action(query.action) || (query.entity.empty() && !query.action.empty()))
      return onx_entity_config::error("Select a supported entity and an automation or script action");
    const auto domain = custom_logic::ha_domain_from_entity_id(query.entity);
    if (onx_controls::handles(query.entity) && !query.action.empty())
      return onx_entity_config::error("This entity uses native press controls; choose Default");
    if (!query.type.empty()) {
      const bool allowed = (domain == "switch" && (query.type == "Switch" || query.type == "Plug")) ||
          (domain == "light" && (query.type == "Light (On/Off)" || query.type == "Dimmable Light" || query.type == "Color Temperature Light" || query.type == "RGB Light")) ||
          (domain == "cover" && (query.type == "Cover (Preset Off)" || query.type == "Cover (Preset On)"));
      if (!allowed) return onx_entity_config::error("Choose a type supported by this entity");
    }
    if (!custom_logic::save_device_config_entity_id(query.slot, query.entity))
      return onx_entity_config::error("Could not save the displayed entity; retry");
    if (!onx_entity_config::save_action(query.slot, query.entity, query.action))
      return onx_entity_config::error("Entity saved, but press action could not be saved; retry");
    if (!onx_entity_config::save_selected_metadata(query)) return onx_entity_config::error("Could not save selected entity details");
    auto &config = custom_logic::device_inferred_config(query.slot);
    config.title = query.name.empty() ? query.entity : query.name;
    if (!query.type.empty()) {
      if (!custom_logic::save_device_custom_config(query.slot, custom_logic::custom_type_from_device1_type_option(query.type), custom_logic::custom_light_capability_mask_from_device1_type_option(query.type)))
        return onx_entity_config::error("Could not save entity type");
    }
    custom_logic::apply_device_config_to_normal_ui_storage(query.slot);
    esphome::select::Select *entities[] = {id(device1_config), id(device2_config), id(device3_config),
        id(device4_config), id(device5_config), id(device6_config), id(device7_config),
        id(device8_config), id(device9_config), id(device10_config)};
    esphome::select::Select *types[] = {id(device1_type), id(device2_type), id(device3_type),
        id(device4_type), id(device5_type), id(device6_type), id(device7_type),
        id(device8_type), id(device9_type), id(device10_type)};
    onx_entity_config::sync_select(query.slot, entities[query.slot]);
    custom_logic::apply_device_type_options(query.slot, types[query.slot]);
    id(normal_device_count) = static_cast<int>(custom_logic::configured_normal_device_count());
    id(normal_device_detail_active) = false;
    id(normal_device_detail_kind) = NORMAL_DEVICE_DETAIL_KIND_NONE;
    id(normal_page_index) = 0;
    id(normal_device_selected_index) = 0;
    if (!query.entity.empty()) custom_logic_entity_sub::subscribe_entity(id(api_server), query.slot, query.entity);
    id(show_normal_device_entry_page).execute(0);
    id(refresh_normal_device_page).execute();
    custom_logic::disconnect_all_clients_for_refresh(id(api_server));
    return std::string("{\"ok\":true}");

api:
  id: api_server
  homeassistant_states: true
  on_client_connected:
    then:
      # Authentication completes before HA sends its state-subscription request,
      # so this callback must not treat every API client as Home Assistant.
      - script.execute: refresh_normal_ha_connection_state
  on_client_disconnected:
    then:
      # The callback runs after the departing client has been removed. Recheck
      # the remaining state-subscribing clients instead of forcing offline.
      - script.execute: refresh_normal_ha_connection_state
  actions:
    - action: show_message
      description: Show a display reminder for 60 seconds, or until the knob is pressed.
      variables:
        title: string
        message: string
      then:
        - lambda: |-
            onx_notification::current.show(title,message,60);
            id(refresh_normal_message_popup).execute();
    - action: show_message_with_timeout
      description: Show a display reminder with a custom timeout; zero means until dismissed.
      variables:
        title: string
        message: string
        timeout_seconds: int
      then:
        - lambda: |-
            onx_notification::current.show(title,message,timeout_seconds);
            id(refresh_normal_message_popup).execute();
    - action: dismiss_message
      description: Dismiss the current or pending display reminder.
      then:
        - lambda: |-
            onx_notification::current.dismiss();
            id(refresh_normal_message_popup).execute();
    - action: show_control_feedback
      description: Show a brief, non-blocking value popup for a configured control entity.
      variables:
        entity_id: string
        value: string
        unit: string
      then:
        - lambda: |-
            for(int slot=0;slot<20;++slot)
              if(entity_id==std::string(onx_gesture::configs[slot].entity) &&
                  custom_logic::cached_device_entity_id(slot)==onx_gesture::configs[slot].entity)
                onx_gesture::feedback(slot,value,unit,millis(),true);
            id(refresh_normal_gesture_feedback).execute();

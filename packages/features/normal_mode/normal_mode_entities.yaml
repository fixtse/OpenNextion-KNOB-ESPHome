switch:
  - platform: gpio
    id: normal_gpio_io10
    name: "HMI IO10"
    pin: GPIO10
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lambda: |-
            for (int i = 0; i < 20; i++) {
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(i);
              if (local_hmi_gpio_switch_io_from_entity_id(entity_id) == 10) {
                id(app_storage)->set_normal_ui_device_state(i, true);
              }
            }
            if (id(normal_device_detail_active)) id(refresh_normal_switch_detail_page).execute();
    on_turn_off:
      then:
        - lambda: |-
            for (int i = 0; i < 20; i++) {
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(i);
              if (local_hmi_gpio_switch_io_from_entity_id(entity_id) == 10) {
                id(app_storage)->set_normal_ui_device_state(i, false);
              }
            }
            if (id(normal_device_detail_active)) id(refresh_normal_switch_detail_page).execute();

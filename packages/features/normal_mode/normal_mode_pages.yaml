            text_font: fonts_MiSans_Medium_20
            text_color: 0xFFFFFF
            text: !lambda |-
              if (!id(ha_time_ready)) {
                return std::string("----");
              }
              auto now = id(ha_time).now();
              if (!now.is_valid()) {
                return std::string("----");
              }
              return now.strftime(onx_display_settings::date_pattern());

              - slider:
                  id: normal_settings_brightness_slider
                  x: 0
                  y: -6
                  width: 168
                  height: 12
                  align: center
                  value: 100
                  min_value: 10
                  max_value: 100
                  on_change:
                    then:
                      - lambda: |-
                          int pct = (int) x;
                          if (pct < 10) pct = 10;
                          if (pct > 100) pct = 100;
                          id(normal_brightness_value) = pct;
                          auto call = id(lcd_backlight)->make_call();
                          call.set_brightness((float)pct / 100.0f);
                          call.set_state(true);
                          call.perform();
                          id(screen_off_state) = false;
                          id(ha_display_light_syncing) = true;
                          auto ha_call = id(ha_light)->make_call();
                          ha_call.set_state(true);
                          ha_call.set_brightness((float)pct / 100.0f);
                          ha_call.perform();
                          id(ha_display_light_syncing) = false;
                          char value_text[48];
                          snprintf(value_text, sizeof(value_text), "Brightness: %d%%", pct);
                          lv_label_set_text(id(normal_settings_brightness_value_label), value_text);
                          id(ui_presenter)->notify_user_activity();

lvgl:
  top_layer:
    widgets:
      - image:
          id: normal_device_wifi_online_widget
          x: -13
          y: 10
          width: 20
          align: TOP_MID
          src: standby_wifi_online_img
          hidden: true
      - image:
          id: normal_device_wifi_offline_widget
          x: -13
          y: 10
          align: TOP_MID
          src: standby_wifi_offline_img
          hidden: true
      - image:
          id: normal_device_homeassistant_online_widget
          x: 13
          y: 10
          align: TOP_MID
          src: standby_homeassistant_online_img
          hidden: true
      - image:
          id: normal_device_homeassistant_offline_widget
          x: 13
          y: 10
          align: TOP_MID
          src: standby_homeassistant_offline_img
          hidden: true
      - obj:
          id: normal_action_feedback
          align: bottom_mid
          y: -28
          width: 48
          height: 48
          radius: 24
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - image:
                id: normal_action_feedback_icon
                align: center
                src: action_sent_img
      - obj:
          id: normal_message_overlay
          x: 0
          y: 0
          width: 240
          height: 240
          radius: 120
          bg_color: 0x1A1A1A
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - label:
                align: top_mid
                y: 20
                text_font: fonts_MiSans_Bold_12
                text_color: 0x62B0FF
                text: "Notification"
            - label:
                id: normal_message_title
                align: top_mid
                y: 43
                width: 184
                height: 44
                long_mode: WRAP
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""
            - obj:
                id: normal_message_body
                align: top_mid
                y: 94
                width: 184
                height: 100
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: true
                clickable: false
                widgets:
                  - label:
                      id: normal_message_text
                      x: 0
                      y: 0
                      width: 176
                      long_mode: WRAP
                      text_font: fonts_MiSans_Medium_16
                      text_color: 0xFFFFFF
                      text: ""
            - label:
                align: top_mid
                y: 208
                width: 184
                text_align: CENTER
                text_font: fonts_MiSans_Bold_12
                text_color: 0xB8B8B8
                text: "Turn to scroll · Press to dismiss"
      - obj:
          id: normal_gesture_feedback
          align: bottom_mid
          y: -30
          width: 184
          height: 40
          radius: 12
          bg_color: 0x000000
          bg_opa: 85%
          border_width: 0
          pad_all: 4
          clickable: false
          scrollable: false
          hidden: true
          widgets:
            - label:
                id: normal_gesture_feedback_text
                align: center
                width: 174
                long_mode: DOT
                text_align: CENTER
                text_font: fonts_MiSans_Medium_18
                text_color: 0xFFFFFF
                text: ""

script:
  - id: enter_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = true;
          id(sleep_wakeup_pending) = false;
      - switch.turn_on: ha_screen_off
  - id: exit_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (!id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = false;
          id(sleep_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: exit_standby_mode
    mode: restart
    then:
      - lambda: |-
          id(standby_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: refresh_normal_ha_connection_state
    mode: restart
    then:
      - lambda: |-
          const bool ha_connected =
              id(api_server)->is_connected_with_state_subscription();
          if (id(normal_ha_api_connected) == ha_connected) {
            return;
          }

          id(normal_ha_api_connected) = ha_connected;
          if (ha_connected) {
            id(normal_ha_added) = true;
          }

          if (ha_connected) {
            lv_obj_clear_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(ui_presenter)->is_normal_mode_active() &&
              !id(ui_presenter)->is_standby_active() &&
              id(normal_page_index) == 0 &&
              !id(normal_device_detail_active)) {
            id(show_normal_device_entry_page).execute(0);
          }
          id(refresh_normal_device_page).execute();
          id(refresh_normal_switch_detail_page).execute();
          id(refresh_normal_automation_detail_page).execute();
          id(refresh_normal_light_detail_page).execute();
          id(refresh_normal_curtain_detail_page).execute();
  - id: refresh_normal_device_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              id(normal_page_index) != 0) {
            lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 10) total = 10;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;

          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          id(normal_device_selected_index) = selected;

          struct EntryWidgets {
            lv_obj_t *icon_switch;
            lv_obj_t *icon_switch_on;
            lv_obj_t *icon_plug;
            lv_obj_t *icon_plug_on;
            lv_obj_t *icon_light;
            lv_obj_t *icon_light_on;
            lv_obj_t *icon_curtain;
            lv_obj_t *icon_settings;
            lv_obj_t *title;
            lv_obj_t *index_icon;
          };

          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          auto lower = [](std::string s) {
            for (char &c : s) {
              if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
            }
            return s;
          };

          auto device_title_at = [&](int index) -> std::string {
            const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(index);
            std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
            if (device_title.empty()) {
              device_title = device_entity_id;
            }
            return device_title;
          };

          auto device_type_at = [&](int index) -> std::string {
            return id(ui_presenter)->get_normal_device_type(index);
          };

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };

          auto render_entry = [&](EntryWidgets w, int entry_index) {
            const bool settings_entry = entry_index >= total;
            std::string device_title = settings_entry ? "Settings" : device_title_at(entry_index);
            std::string device_type = settings_entry ? "settings" : device_type_at(entry_index);

            int device_kind = 1;
            if (settings_entry) {
              device_kind = 5;
            } else {
              if (device_type.empty()) device_type = "switch";
              device_type = lower(device_type);
              if (device_type == "switch") {
                device_kind = 1;
              } else if (device_type == "plug" || device_type == "chazuo") {
                device_kind = 3;
              } else if (device_type == "light" || device_type == "liang" ||
                         device_type == "dimming_light" || device_type == "dimmable_light" || device_type == "dimming") {
                device_kind = 2;
              } else if (device_type == "curtain" || device_type == "cover") {
                device_kind = 4;
              } else if (device_type == "automation" || device_type == "sensor" || device_type == "binary_sensor" || device_type == "climate" || device_type == "script" || device_type == "weather" || device_type == "timer" || device_type == "media_player") {
                device_kind = 10;
              }
            }

            if (!settings_entry && device_title.empty()) {
              if (device_kind == 1) {
                device_title = "switch";
              } else if (device_kind == 3) {
                device_title = "plug";
              } else if (device_kind == 4) {
                device_title = "curtain";
              } else if (device_kind == 10) {
                device_title = "automation";
              } else {
                device_title = "light";
              }
            }

            set_hidden(w.icon_switch, !(device_kind == 1 || device_kind == 10));
            set_hidden(w.icon_switch_on, true);
            set_hidden(w.icon_plug, device_kind != 3);
            set_hidden(w.icon_plug_on, true);
            set_hidden(w.icon_light, !(device_kind == 2 || device_kind == 7));
            set_hidden(w.icon_light_on, true);
            set_hidden(w.icon_curtain, device_kind != 4);
            set_hidden(w.icon_settings, device_kind != 5);
            lv_img_set_src(w.icon_switch,
                           device_type == "weather" ? id(standby_weather_icon_partlycloudy_img) :
                           device_kind == 10 ? id(normal_device_automation_img)
                                             : id(normal_device_icon_switch_img));
            if (device_kind == 4 && !settings_entry) {
              const uint8_t curtain_position = id(app_storage)->get_normal_ui_device_position(entry_index);
              if (curtain_position >= 100) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_open_img));
              } else if (curtain_position == 0) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_closed_img));
              } else {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
              }
            } else {
              lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
            }

            if (!settings_entry && (device_kind == 1 || device_kind == 3 || device_kind == 2 || device_kind == 7)) {
              bool local_state = false;
              if (device_kind == 1 && local_hmi_gpio_switch_state(id(ui_presenter)->get_normal_device_entity_id(entry_index), &local_state)) {
                id(app_storage)->set_normal_ui_device_state(entry_index, local_state);
              }
              bool is_on = id(app_storage)->get_normal_ui_device_state(entry_index);
              if (device_kind == 1) {
                set_hidden(w.icon_switch, is_on);
                set_hidden(w.icon_switch_on, !is_on);
              } else if (device_kind == 3) {
                set_hidden(w.icon_plug, is_on);
                set_hidden(w.icon_plug_on, !is_on);
              } else {
                set_hidden(w.icon_light, is_on);
                set_hidden(w.icon_light_on, !is_on);
              }
            }

            lv_label_set_text(w.title, device_title.c_str());
            if (settings_entry) {
              set_hidden(id(normal_device_index_text), true);
              set_hidden(w.index_icon, false);
            } else {
              char index_text[16];
              snprintf(index_text, sizeof(index_text), "%d/%d", entry_index + 1, total);
              lv_label_set_text(id(normal_device_index_text), index_text);
              set_hidden(id(normal_device_index_text), false);
              set_hidden(w.index_icon, true);
            }
          };

          if (total == 0 && selected == 0) {
            set_hidden(id(normal_device_wifi_online_widget), true);
            set_hidden(id(normal_device_wifi_offline_widget), true);
            set_hidden(id(normal_device_homeassistant_online_widget), true);
            set_hidden(id(normal_device_homeassistant_offline_widget), true);
            set_hidden(id(normal_device_index_text), true);
            return;
          }
          set_hidden(id(normal_device_wifi_online_widget), !id(normal_wifi_connected));
          set_hidden(id(normal_device_wifi_offline_widget), id(normal_wifi_connected));
          set_hidden(id(normal_device_homeassistant_online_widget), !id(normal_ha_api_connected));
          set_hidden(id(normal_device_homeassistant_offline_widget), id(normal_ha_api_connected));
          if (selected >= total) {
            render_entry({id(normal_device_settings_icon_switch), id(normal_device_settings_icon_switch_on), id(normal_device_settings_icon_plug), id(normal_device_settings_icon_plug_on), id(normal_device_settings_icon_light), id(normal_device_settings_icon_light_on), id(normal_device_settings_icon_curtain), id(normal_device_settings_icon_settings), id(normal_device_settings_title), id(normal_device_settings_index_icon)}, selected);
          } else {
            switch (selected) {
              case 0:
                render_entry({id(normal_device_0_icon_switch), id(normal_device_0_icon_switch_on), id(normal_device_0_icon_plug), id(normal_device_0_icon_plug_on), id(normal_device_0_icon_light), id(normal_device_0_icon_light_on), id(normal_device_0_icon_curtain), id(normal_device_0_icon_settings), id(normal_device_0_title), id(normal_device_0_index_icon)}, 0);
                break;
              case 1:
                render_entry({id(normal_device_1_icon_switch), id(normal_device_1_icon_switch_on), id(normal_device_1_icon_plug), id(normal_device_1_icon_plug_on), id(normal_device_1_icon_light), id(normal_device_1_icon_light_on), id(normal_device_1_icon_curtain), id(normal_device_1_icon_settings), id(normal_device_1_title), id(normal_device_1_index_icon)}, 1);
                break;
              case 2:
                render_entry({id(normal_device_2_icon_switch), id(normal_device_2_icon_switch_on), id(normal_device_2_icon_plug), id(normal_device_2_icon_plug_on), id(normal_device_2_icon_light), id(normal_device_2_icon_light_on), id(normal_device_2_icon_curtain), id(normal_device_2_icon_settings), id(normal_device_2_title), id(normal_device_2_index_icon)}, 2);
                break;
              case 3:
                render_entry({id(normal_device_3_icon_switch), id(normal_device_3_icon_switch_on), id(normal_device_3_icon_plug), id(normal_device_3_icon_plug_on), id(normal_device_3_icon_light), id(normal_device_3_icon_light_on), id(normal_device_3_icon_curtain), id(normal_device_3_icon_settings), id(normal_device_3_title), id(normal_device_3_index_icon)}, 3);
                break;
              case 4:
                render_entry({id(normal_device_4_icon_switch), id(normal_device_4_icon_switch_on), id(normal_device_4_icon_plug), id(normal_device_4_icon_plug_on), id(normal_device_4_icon_light), id(normal_device_4_icon_light_on), id(normal_device_4_icon_curtain), id(normal_device_4_icon_settings), id(normal_device_4_title), id(normal_device_4_index_icon)}, 4);
                break;
              case 5:
                render_entry({id(normal_device_5_icon_switch), id(normal_device_5_icon_switch_on), id(normal_device_5_icon_plug), id(normal_device_5_icon_plug_on), id(normal_device_5_icon_light), id(normal_device_5_icon_light_on), id(normal_device_5_icon_curtain), id(normal_device_5_icon_settings), id(normal_device_5_title), id(normal_device_5_index_icon)}, 5);
                break;
              case 6:
                render_entry({id(normal_device_6_icon_switch), id(normal_device_6_icon_switch_on), id(normal_device_6_icon_plug), id(normal_device_6_icon_plug_on), id(normal_device_6_icon_light), id(normal_device_6_icon_light_on), id(normal_device_6_icon_curtain), id(normal_device_6_icon_settings), id(normal_device_6_title), id(normal_device_6_index_icon)}, 6);
                break;
              case 7:
                render_entry({id(normal_device_7_icon_switch), id(normal_device_7_icon_switch_on), id(normal_device_7_icon_plug), id(normal_device_7_icon_plug_on), id(normal_device_7_icon_light), id(normal_device_7_icon_light_on), id(normal_device_7_icon_curtain), id(normal_device_7_icon_settings), id(normal_device_7_title), id(normal_device_7_index_icon)}, 7);
                break;
              case 8:
                render_entry({id(normal_device_8_icon_switch), id(normal_device_8_icon_switch_on), id(normal_device_8_icon_plug), id(normal_device_8_icon_plug_on), id(normal_device_8_icon_light), id(normal_device_8_icon_light_on), id(normal_device_8_icon_curtain), id(normal_device_8_icon_settings), id(normal_device_8_title), id(normal_device_8_index_icon)}, 8);
                break;
              default:
                render_entry({id(normal_device_9_icon_switch), id(normal_device_9_icon_switch_on), id(normal_device_9_icon_plug), id(normal_device_9_icon_plug_on), id(normal_device_9_icon_light), id(normal_device_9_icon_light_on), id(normal_device_9_icon_curtain), id(normal_device_9_icon_settings), id(normal_device_9_title), id(normal_device_9_index_icon)}, 9);
                break;
            }
          }

  - id: show_normal_device_entry_page
    mode: restart
    parameters:
      direction: int
    then:
      - script.execute: refresh_normal_device_page
      - lambda: |-
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 10) total = 10;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          id(normal_device_selected_index) = selected;

          lv_obj_t *target = id(device_settings)->obj;
          if (total == 0 && selected == 0) {
            target = id(normal_ha_added) ? id(device_empty)->obj : id(normal_add_hmi_page)->obj;
          } else if (total == 0 && !id(normal_ha_added) && selected == 1) {
            target = id(normal_add_hmi_hello_page)->obj;
          } else if (selected < total) {
            switch (selected) {
              case 0: target = id(device_0)->obj; break;
              case 1: target = id(device_1)->obj; break;
              case 2: target = id(device_2)->obj; break;
              case 3: target = id(device_3)->obj; break;
              case 4: target = id(device_4)->obj; break;
              case 5: target = id(device_5)->obj; break;
              case 6: target = id(device_6)->obj; break;
              case 7: target = id(device_7)->obj; break;
              case 8: target = id(device_8)->obj; break;
              default: target = id(device_9)->obj; break;
            }
          }

          if (lv_scr_act() == target) {
            return;
          }
          if (direction == 0) {
            lv_scr_load(target);
            return;
          }
          lv_scr_load_anim(target,
                           direction > 0 ? LV_SCR_LOAD_ANIM_MOVE_LEFT : LV_SCR_LOAD_ANIM_MOVE_RIGHT,
                           220, 0, false);

  - id: refresh_normal_switch_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              (id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_SWITCH &&
               id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_PLUG)) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };

          bool is_on = id(app_storage)->get_normal_ui_device_state(detail_index);
          const bool is_local_gpio_switch = local_hmi_gpio_switch_state(device_entity_id, &is_on);
          if (is_local_gpio_switch) {
            id(app_storage)->set_normal_ui_device_state(detail_index, is_on);
          }
          id(normal_device_detail_is_on) = is_on;
          std::string state_text = is_on ? "ON" : "OFF";

          lv_obj_t *page = id(normal_switch_page)->obj;
          lv_obj_t *shell = id(normal_switch_detail_shell);
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          if (is_on) {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_title), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x272727), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x272727), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_title), lv_color_hex(0xD2D2D2), 0);
          }
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH) {
            set_hidden(id(normal_device_detail_plug_on), true);
            set_hidden(id(normal_device_detail_plug_off), true);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), !is_on);
            set_hidden(id(normal_device_detail_switch_off), is_on);
          } else if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG) {
            set_hidden(id(normal_device_detail_plug_on), !is_on);
            set_hidden(id(normal_device_detail_plug_off), is_on);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), true);
            set_hidden(id(normal_device_detail_switch_off), true);
          }

          lv_label_set_text(id(normal_switch_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_switch_detail_title), device_title.c_str());
          lv_obj_t *sw = id(hmi_gui_switch);
          if (is_on) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          const bool is_online = is_local_gpio_switch ||
                                 ((detail_index >= 0 && detail_index < 10)
                                      ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                      : true);
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !is_local_gpio_switch &&
                                               (!id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online);
          set_hidden(id(normal_switch_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_switch_detail_offline_text), offline_text);

  - id: refresh_normal_automation_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);

          int detail_index = std::clamp(id(normal_device_detail_index), 0, 9);
          const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string title = ha_entity_title_from_registry_cache(entity_id);
          if (title.empty()) {
            title = entity_id.empty() ? "Automation" : entity_id;
          }
          lv_label_set_text(id(normal_automation_detail_title), title.c_str());
          const bool timer_detail = custom_logic_entity_sub::is_timer_detail(entity_id);
          auto *timer_state = custom_logic_entity_sub::entity_detail(entity_id);
          if (timer_detail && timer_state != nullptr && !timer_state->timer_name.empty())
            lv_label_set_text(id(normal_automation_detail_title), timer_state->timer_name.c_str());
          if (timer_detail) {
            lv_obj_clear_flag(id(normal_timer_detail_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_timer_detail_countdown), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_timer_detail_status), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_automation_detail_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_automation_detail_action), LV_OBJ_FLAG_HIDDEN);
            id(refresh_normal_timer_detail).execute();
          } else {
            lv_obj_add_flag(id(normal_timer_detail_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_timer_detail_countdown), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_timer_detail_status), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_automation_detail_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_automation_detail_action), LV_OBJ_FLAG_HIDDEN);
          }
          id(refresh_normal_media_cover).execute();
          std::string last_trigger_text = "Never";
          const auto now = id(ha_time).now();
          if (now.is_valid()) {
            last_trigger_text = custom_logic_entity_sub::automation_last_triggered_relative_text(
                detail_index, entity_id, now.timestamp);
          }
          if (auto *detail = custom_logic_entity_sub::entity_detail(entity_id)) {
            if (entity_id.rfind("climate.", 0) == 0) {
              last_trigger_text = detail->state + "\nNow: " + detail->current;
              if (std::isfinite(custom_logic_entity_sub::detail_number(detail->target)))
                last_trigger_text += "\nSet: " + detail->target;
              else
                last_trigger_text += "\nRange: " + detail->low + " - " + detail->high;
            } else if (entity_id.rfind("media_player.", 0) == 0) {
              const float volume = custom_logic_entity_sub::detail_number(detail->volume);
              last_trigger_text = std::string("Volume: ") +
                                  (std::isfinite(volume) ? std::to_string(static_cast<int>(std::clamp(volume, 0.0f, 1.0f) * 100 + 0.5f)) + "%" : "--");
            } else if (entity_id.rfind("weather.", 0) == 0) {
              last_trigger_text = detail->state + "\n" + detail->target + detail->unit +
                                  "\nHumidity: " + detail->humidity + "%";
            } else {
              last_trigger_text = detail->state;
              if (!detail->unit.empty()) last_trigger_text += " " + detail->unit;
            }
          }
          lv_obj_set_y(id(normal_automation_detail_action), (entity_id.rfind("climate.", 0) == 0 || entity_id.rfind("weather.", 0) == 0 || entity_id.rfind("media_player.", 0) == 0) ? 126 : 148);
          if (entity_id.rfind("media_player.", 0) == 0) lv_obj_set_y(id(normal_automation_detail_action), 166);
          lv_label_set_text(id(normal_automation_detail_action), last_trigger_text.c_str());
          lv_img_set_src(id(normal_automation_detail_icon),
                         id(normal_automation_press_feedback_active)
                             ? id(normal_device_automation_detail_press_img)
                             : id(normal_device_automation_detail_img));

          if (entity_id.rfind("weather.", 0) == 0) {
            const auto *detail = custom_logic_entity_sub::entity_detail(entity_id);
            const std::string state = detail == nullptr ? "" : detail->state;
            const void *icon = id(standby_weather_icon_unknown_img);
            if (state == "clear-night") icon = id(standby_weather_icon_clear_night_img);
            if (state == "cloudy") icon = id(standby_weather_icon_cloudy_img);
            if (state == "exceptional") icon = id(standby_weather_icon_exceptional_img);
            if (state == "fog") icon = id(standby_weather_icon_fog_img);
            if (state == "hail") icon = id(standby_weather_icon_hail_img);
            if (state == "lightning") icon = id(standby_weather_icon_lightning_img);
            if (state == "lightning-rainy") icon = id(standby_weather_icon_lightning_rainy_img);
            if (state == "partlycloudy") icon = id(standby_weather_icon_partlycloudy_img);
            if (state == "pouring") icon = id(standby_weather_icon_pouring_img);
            if (state == "rainy") icon = id(standby_weather_icon_rainy_img);
            if (state == "snowy") icon = id(standby_weather_icon_snowy_img);
            if (state == "snowy-rainy") icon = id(standby_weather_icon_snowy_rainy_img);
            if (state == "sunny") icon = id(standby_weather_icon_sunny_img);
            if (state == "windy") icon = id(standby_weather_icon_windy_img);
            if (state == "windy-variant") icon = id(standby_weather_icon_windy_variant_img);
            lv_img_set_src(id(normal_automation_detail_icon), icon);
          }

          const bool is_online = (id(normal_device_online_mask) & (1 << detail_index)) != 0;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay =
              !id(normal_wifi_connected) || !id(normal_ha_api_connected) || !is_online;
          if (show_connection_overlay) {
            lv_obj_clear_flag(id(normal_automation_detail_offline_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_automation_detail_offline_overlay), LV_OBJ_FLAG_HIDDEN);
          }
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected)
                                                ? "Home Assistant\ndisconnected"
                                                : "Device Offline");
          lv_label_set_text(id(normal_automation_detail_offline_text), offline_text);

  - id: refresh_normal_light_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          auto detail_slot = id(app_storage)->normal_device_slot(detail_index);
          auto light_state = detail_slot.light();
          bool is_on = light_state.is_on;
          int brightness = (int) light_state.brightness_pct;
          if (brightness < 0) brightness = 0;
          if (brightness > 100) brightness = 100;
          const int displayed_brightness = is_on ? brightness : 0;
          int last_nonzero = (int) light_state.last_nonzero_brightness_pct;
          if (last_nonzero < 1 || last_nonzero > 100) last_nonzero = 100;
          const bool brightness_capable = light_state.custom_supports_brightness();
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT && brightness_capable) {
            if (is_on && brightness <= 0) {
              brightness = last_nonzero;
              if (brightness < 1 || brightness > 100) brightness = 100;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(brightness);
              detail_slot.update_light(patch);
            }
            if (brightness > 0) {
              last_nonzero = brightness;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(last_nonzero);
              detail_slot.update_light(patch);
            }
          }
          id(normal_device_detail_light_brightness) = displayed_brightness;
          id(normal_device_detail_light_last_nonzero_brightness) = last_nonzero;
          id(normal_device_detail_is_on) = is_on;
          std::string state_text = is_on ? "ON" : "OFF";
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT && brightness_capable) {
            state_text = is_on ? (std::to_string(displayed_brightness) + "%") : "OFF";
          }

          lv_obj_t *page = id(normal_light_page)->obj;
          lv_obj_t *shell = id(normal_light_detail_shell);
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          if (is_on) {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_light_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_light_detail_title), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x272727), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x272727), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_light_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_light_detail_title), lv_color_hex(0xD2D2D2), 0);
          }

          set_hidden(id(normal_light_device_detail_switch_on), true);
          set_hidden(id(normal_light_device_detail_switch_off), true);
          set_hidden(id(normal_light_device_detail_plug_on), true);
          set_hidden(id(normal_light_device_detail_plug_off), true);
          set_hidden(id(normal_light_device_detail_light_on), !is_on);
          set_hidden(id(normal_light_device_detail_light_off), is_on);

          lv_label_set_text(id(normal_light_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_light_detail_title), device_title.c_str());
          const bool is_light = id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT;
          auto is_mode_enabled = [&](int mode) -> bool {
            if (mode == 0) {
              return light_state.custom_supports_brightness();
            }
            if (mode == 1) {
              return light_state.custom_supports_color_temperature();
            }
            if (mode == 2) {
              return light_state.custom_supports_rgb();
            }
            return false;
          };
          const bool mode_0_enabled = is_mode_enabled(0);
          const bool mode_1_enabled = is_mode_enabled(1);
          const bool mode_2_enabled = is_mode_enabled(2);
          int mode_count = 0;
          for (int i = 0; i < 3; ++i) {
            if (is_mode_enabled(i)) {
              mode_count++;
            }
          }
          id(normal_detail_light_mode_count) = mode_count;
          const bool has_adjustable_mode = mode_count > 0;
          const bool mode_switching = is_light && has_adjustable_mode && !id(normal_clear_wifi_allowed);
          auto set_mode_shell_layout = [&]() {
            if (mode_switching) {
              lv_obj_set_pos(id(normal_light_detail_mode_text_shell), 0, 165);
              lv_obj_set_size(id(normal_light_detail_mode_text_shell), 90, 26);
            } else {
              lv_obj_set_pos(id(normal_light_detail_mode_text_shell), 0, 166);
              lv_obj_set_size(id(normal_light_detail_mode_text_shell), 90, 23);
            }
          };
          auto set_mode_icon_visual = [&](lv_obj_t *icon, lv_obj_t *img, bool active) {
            const int size = mode_switching ? (active ? 26 : 23) : 20;
            const uint16_t zoom = mode_switching ? (active ? 333 : 295) : 256;
            lv_obj_set_size(icon, size, size);
            lv_obj_set_style_radius(icon, size / 2, 0);
            lv_img_set_zoom(img, zoom);
            lv_img_set_pivot(img, 10, 10);
            lv_img_set_antialias(img, true);
            lv_obj_set_style_border_width(icon, active ? 3 : 0, 0);
            lv_obj_set_style_border_color(icon, lv_color_hex(0xFFFFFF), 0);
          };
          if (!is_mode_enabled(id(normal_detail_light_mode))) {
            for (int mode = 0; mode < 3; ++mode) {
              if (is_mode_enabled(mode)) {
                id(normal_detail_light_mode) = mode;
                break;
              }
            }
          }
          set_mode_shell_layout();
          set_hidden(id(normal_light_detail_mode_text_shell), !is_light || !has_adjustable_mode);
          set_hidden(id(normal_light_detail_mode_icon_brightness), !is_light || !mode_0_enabled);
          set_hidden(id(normal_light_detail_mode_icon_cct), !is_light || !mode_1_enabled);
          set_hidden(id(normal_light_detail_mode_icon_color), !is_light || !mode_2_enabled);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_brightness), id(normal_light_detail_mode_icon_brightness_img),
                               is_light && mode_0_enabled && id(normal_detail_light_mode) == 0);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_cct), id(normal_light_detail_mode_icon_cct_img),
                               is_light && mode_1_enabled && id(normal_detail_light_mode) == 1);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_color), id(normal_light_detail_mode_icon_color_img),
                               is_light && mode_2_enabled && id(normal_detail_light_mode) == 2);

          const bool show_cct_bar = is_light && mode_1_enabled && id(normal_detail_light_mode) == 1;
          const bool show_rgb_bar = is_light && mode_2_enabled && id(normal_detail_light_mode) == 2;
          set_hidden(id(normal_light_dimming_light_detail_arc),
                     !is_light || !mode_0_enabled || id(normal_detail_light_mode) != 0);
          if (is_light && mode_0_enabled) {
            lv_arc_set_value(id(normal_light_dimming_light_detail_arc), std::clamp(displayed_brightness, 0, 100));
          }
          lv_obj_t *sw = id(hmi_gui_switch);
          if (is_on) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          const bool is_online = (detail_index >= 0 && detail_index < 10)
                                     ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                     : true;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online;
          set_hidden(id(normal_light_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_light_detail_offline_text), offline_text);

          set_hidden(id(normal_light_cct_gradient), !show_cct_bar);
          set_hidden(id(normal_light_rgb_gradient), !show_rgb_bar);
          set_hidden(id(normal_light_cct_value_arc), !show_cct_bar);
          set_hidden(id(normal_light_rgb_value_arc), !show_rgb_bar);
          lv_obj_set_style_img_opa(id(normal_light_cct_gradient), is_on ? LV_OPA_COVER : LV_OPA_40, 0);
          lv_obj_set_style_img_opa(id(normal_light_rgb_gradient), is_on ? LV_OPA_COVER : LV_OPA_40, 0);
          if (show_cct_bar) {
            int value_pct = std::clamp<int>(detail_slot.light().color_temperature_step(), 0, 10);
            id(normal_light_cct_value_pct) = value_pct;
            lv_arc_set_value(id(normal_light_cct_value_arc), value_pct);
          }
          if (show_rgb_bar) {
            int value_pct = (int) detail_slot.light().rgb_tick;
            value_pct = std::clamp(value_pct, 0, 35);
            id(normal_light_rgb_value_pct) = value_pct;
            lv_arc_set_value(id(normal_light_rgb_value_arc), value_pct);
          }

  - id: update_normal_detail_exit_ready_flags
    mode: restart
    then:
      - lambda: |-
          const uint32_t held_ms = millis() - id(key_press_started_ms);
          const int kind = id(normal_device_detail_kind);
          if (kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH || kind == NORMAL_DEVICE_DETAIL_KIND_PLUG || kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            id(normal_detail_exit_switch_ready) = held_ms >= 688;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            id(normal_detail_exit_switch_ready) = held_ms >= 688;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= 688;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= 688;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL_QR_CODE) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = held_ms >= 688;
          } else {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          }

  - id: can_exit_normal_detail
    mode: restart
    then:
      - lambda: |-
          if (!id(normal_device_detail_active)) {
            id(normal_detail_exit_allowed) = false;
            return;
          }
          switch (id(normal_device_detail_kind)) {
            case NORMAL_DEVICE_DETAIL_KIND_SWITCH:
            case NORMAL_DEVICE_DETAIL_KIND_PLUG:
            case NORMAL_DEVICE_DETAIL_KIND_CURTAIN:
            case NORMAL_DEVICE_DETAIL_KIND_AUTOMATION:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_switch_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL_QR_CODE:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_settings_ready);
              break;
            default:
              id(normal_detail_exit_allowed) = false;
              break;
          }

  - id: refresh_normal_curtain_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          if (!id(normal_device_detail_curtain_adjust_active)) {
            const int storage_position = std::clamp((int) id(app_storage)->get_normal_ui_device_position(detail_index), 0, 100);
            id(normal_device_detail_curtain_feedback_position) = storage_position;
            id(normal_device_detail_curtain_target_position) = storage_position;
          }

          int display_position = id(normal_device_detail_curtain_feedback_position);
          display_position = std::clamp(display_position, 0, 100);

          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          lv_obj_t *page = id(normal_curtain_page)->obj;
          lv_obj_t *shell = id(normal_curtain_detail_shell);
          lv_obj_t *arc = id(normal_curtain_detail_arc);
          lv_obj_t *target_arc = id(normal_curtain_detail_target_arc);
          lv_obj_set_style_bg_color(page, lv_color_hex(0x000000), 0);
          lv_obj_set_style_bg_color(shell, lv_color_hex(0x232323), 0);
          lv_obj_set_style_border_width(shell, 0, 0);
          lv_arc_set_value(arc, display_position);
          const int target_position = std::clamp(id(normal_device_detail_curtain_target_position), 0, 100);
          lv_arc_set_value(target_arc, target_position);
          set_hidden(id(normal_curtain_detail_target_arc), !id(normal_device_detail_curtain_adjust_active));

          set_hidden(id(normal_curtain_detail_0_img), true);
          set_hidden(id(normal_curtain_detail_100_img), true);
          set_hidden(id(normal_curtain_detail_x_img), true);
          if (display_position <= 0) {
            set_hidden(id(normal_curtain_detail_0_img), false);
          } else if (display_position >= 100) {
            set_hidden(id(normal_curtain_detail_100_img), false);
          } else {
            set_hidden(id(normal_curtain_detail_x_img), false);
          }

          set_hidden(id(normal_curtain_detail_opening_on), true);
          set_hidden(id(normal_curtain_detail_opening_off), false);
          set_hidden(id(normal_curtain_detail_pause_on), true);
          set_hidden(id(normal_curtain_detail_pause_off), false);
          set_hidden(id(normal_curtain_detail_closing_on), true);
          set_hidden(id(normal_curtain_detail_closing_off), false);

          std::string state_text = std::to_string(display_position) + "%";
          const uint32_t curtain_state_code = id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 2);
          if (curtain_state_code == 3) {
            state_text = "Opening";
            set_hidden(id(normal_curtain_detail_opening_on), false);
            set_hidden(id(normal_curtain_detail_opening_off), true);
            set_hidden(id(normal_curtain_detail_pause_on), true);
            set_hidden(id(normal_curtain_detail_pause_off), false);
          } else if (curtain_state_code == 4) {
            state_text = "Closing";
            set_hidden(id(normal_curtain_detail_closing_on), false);
            set_hidden(id(normal_curtain_detail_closing_off), true);
            set_hidden(id(normal_curtain_detail_pause_on), true);
            set_hidden(id(normal_curtain_detail_pause_off), false);
          } else {
            set_hidden(id(normal_curtain_detail_pause_on), false);
            set_hidden(id(normal_curtain_detail_pause_off), true);
          }
          if (display_position >= 100) {
            state_text = "Open";
          } else if (display_position <= 0) {
            state_text = "Closed";
          }
          if (id(normal_device_detail_curtain_adjust_active) || 
          (curtain_state_code == 3 || curtain_state_code == 4)) {
            state_text += " -> " + std::to_string(target_position) + "%";
          }

          lv_label_set_text(id(normal_curtain_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_curtain_detail_title), device_title.c_str());
          const bool is_online = (detail_index >= 0 && detail_index < 10)
                                     ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                     : true;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online;
          set_hidden(id(normal_curtain_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_curtain_detail_offline_text), offline_text);


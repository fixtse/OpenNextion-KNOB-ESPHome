  - id: refresh_normal_provisioning_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active()) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);

          auto set_text = [](lv_obj_t *obj, const std::string &text) {
            lv_label_set_text(obj, text.c_str());
          };
          const std::string ssid = get_provisioning_ap_ssid();
          const auto state = id(onx_improv)->get_improv_state();
          const auto error = id(onx_improv)->get_improv_error_state();
          const bool connected = wifi::global_wifi_component != nullptr &&
                                 wifi::global_wifi_component->is_connected();
          std::string address;
          if (connected) {
            for (const auto &ip : wifi::global_wifi_component->get_ip_addresses()) {
              if (!ip.is_set() || !ip.is_ip4()) continue;
              char buffer[network::IP_ADDRESS_BUFFER_SIZE] = {0};
              ip.str_to(buffer);
              address = std::string("http://") + buffer;
              break;
            }
          }
          set_text(id(normal_add_hmi_title), connected ? "Wi-Fi connected" : "Connecting to Wi-Fi");
          set_text(id(normal_add_hmi_ssid), connected ? address : "Please wait");
          set_text(id(normal_add_hmi_hint), connected
              ? "Open this address to choose controls.\nAdd ESPHome in Home Assistant.\nTurn the knob for more options."
              : "Saved Wi-Fi will reconnect.\nNo hotspot setup needed.");
          std::string title = "Wi-Fi setup";
          std::string status = ssid;
          std::string hint = "Join this Wi-Fi hotspot.\nOpen http://192.168.4.1";
          if (connected) {
            title = "Wi-Fi connected";
            status = "Ready to configure";
            hint = "Open the device webpage\nto choose your controls.";
          } else if (state == improv::STATE_PROVISIONING) {
            title = "Bluetooth setup";
            status = "Connecting to Wi-Fi";
            hint = "Please wait.\nKeep setup open on your phone.";
          } else if (state == improv::STATE_AWAITING_AUTHORIZATION) {
            title = "Bluetooth setup";
            status = "Press the knob\nto allow setup";
            hint = "Continue on your phone, or join\n" + ssid + "\nhttp://192.168.4.1";
          } else if (state == improv::STATE_AUTHORIZED) {
            title = "Bluetooth setup";
            status = error == improv::ERROR_UNABLE_TO_CONNECT ? "Could not connect" : "Ready for Wi-Fi";
            hint = error == improv::ERROR_UNABLE_TO_CONNECT
                ? "Check the network and password.\nTry again on your phone."
                : "Choose your Wi-Fi network\non your phone.";
          }
          set_text(id(normal_provisioning_title), title);
          set_text(id(normal_provisioning_ssid), status);
          set_text(id(normal_provisioning_hint), hint);

  - id: emit_normal_switch_control_event
    mode: restart
    then:
      - lambda: |-
          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 19) {
            detail_index = 19;
          }

          std::string device_title = id(ui_presenter)->get_normal_device_title(detail_index);
          if (device_title.empty()) {
            device_title = "switch";
          }

          ESP_LOGI("normal_mode",
                   "switch/plug/light detail pressed: index=%d kind=%d entity_id=%s title=%s local_gpio=%s",
                   detail_index,
                   id(normal_device_detail_kind),
                   id(ui_presenter)->get_normal_device_entity_id(detail_index).c_str(),
                   device_title.c_str(),
                   is_local_hmi_gpio_switch_entity_id(id(ui_presenter)->get_normal_device_entity_id(detail_index))
                       ? "YES"
                       : "NO");
      - lambda: |-
          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) detail_index = 0;
          if (detail_index > 19) detail_index = 19;
          const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          if (!is_local_hmi_gpio_switch_entity_id(entity_id)) {
            return;
          }
          bool new_state = false;
          switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
            case 10:
              new_state = !id(normal_gpio_io10).state;
              if (new_state) {
                id(normal_gpio_io10).turn_on();
              } else {
                id(normal_gpio_io10).turn_off();
              }
              break;
            case 11:
              new_state = !id(normal_gpio_io11).state;
              if (new_state) {
                id(normal_gpio_io11).turn_on();
              } else {
                id(normal_gpio_io11).turn_off();
              }
              break;
            case 17:
              new_state = !id(normal_gpio_io17).state;
              if (new_state) {
                id(normal_gpio_io17).turn_on();
              } else {
                id(normal_gpio_io17).turn_off();
              }
              break;
            case 18:
              new_state = !id(normal_gpio_io18).state;
              if (new_state) {
                id(normal_gpio_io18).turn_on();
              } else {
                id(normal_gpio_io18).turn_off();
              }
              break;
            default:
              return;
          }
          id(app_storage)->set_normal_ui_device_state(detail_index, new_state);
          id(normal_device_detail_is_on) = new_state;
          id(hmi_switch_state) = new_state;
          ESP_LOGI("normal_mode", "local HMI GPIO switch toggled: index=%d entity_id=%s state=%s",
                   detail_index, entity_id.c_str(), new_state ? "ON" : "OFF");
          onx_action_feedback::sent(entity_id, millis());
          id(refresh_normal_action_feedback).execute();
          id(refresh_normal_switch_detail_page).execute();
      - script.execute: emit_normal_switch_or_light_control_event

  - id: emit_normal_automation_control_event
    mode: restart
    parameters:
      detail_index: int
    then:
      - if:
          condition:
            lambda: |-
              return id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                     id(normal_device_detail_index) == detail_index &&
                     id(normal_device_detail_online) && id(normal_ha_api_connected) &&
                     !id(detail_long_press_exit_fired);
          then:
            - if:
                condition:
                  lambda: |-
                    const auto entity = id(ui_presenter)->get_normal_device_entity_id(detail_index);
                    return entity.rfind("sensor.", 0) == 0 || entity.rfind("binary_sensor.", 0) == 0;
                then:
                  - homeassistant.event:
                      event: esphome.onx_sensor_press
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                        state: !lambda |-
                          auto *detail = custom_logic_entity_sub::entity_detail(id(ui_presenter)->get_normal_device_entity_id(detail_index));
                          return detail == nullptr ? std::string("") : detail->state;
                  - script.execute: show_normal_action_sent
            - if:
                condition:
                  lambda: return id(ui_presenter)->get_normal_device_entity_id(detail_index).rfind("script.", 0) == 0;
                then:
                  - homeassistant.service:
                      service: script.turn_on
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                  - script.execute: show_normal_action_sent
      - if:
          condition:
            lambda: |-
              const int index = std::clamp(detail_index, 0, 19);
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(index);
              return id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                     id(normal_device_detail_index) == index &&
                     id(normal_device_detail_online) &&
                     !id(detail_long_press_exit_fired) &&
                     id(normal_ha_api_connected) && entity_id.rfind("automation.", 0) == 0;
          then:
            - lambda: |-
                const int index = std::clamp(detail_index, 0, 19);
                id(normal_automation_press_feedback_active) = true;
                lv_img_set_src(id(normal_automation_detail_icon),
                               id(normal_device_automation_detail_press_img));
                ESP_LOGI("normal_mode",
                         "automation trigger requested: index=%d entity_id=%s",
                         index,
                         id(ui_presenter)->get_normal_device_entity_id(index).c_str());
            - homeassistant.service:
                service: automation.trigger
                data_template:
                  entity_id: "{{ target_entity_id }}"
                variables:
                  target_entity_id: !lambda |-
                    const int index = std::clamp(detail_index, 0, 19);
                    return id(ui_presenter)->get_normal_device_entity_id(index);
            - script.execute: show_normal_action_sent
            - delay: 180ms
            - lambda: |-
                const int index = std::clamp(detail_index, 0, 19);
                id(normal_automation_press_feedback_active) = false;
                if (id(normal_device_detail_active) &&
                    id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                    id(normal_device_detail_index) == index) {
                  lv_img_set_src(id(normal_automation_detail_icon),
                                 id(normal_device_automation_detail_img));
                }

  - id: emit_normal_switch_or_light_control_event
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              int detail_index = id(normal_device_detail_index);
              if (detail_index < 0) detail_index = 0;
              if (detail_index > 19) detail_index = 19;
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
              return !entity_id.empty() && entity_id.rfind("light.", 0) == 0;
          then:
            - homeassistant.service:
                service: light.toggle
                data_template:
                  entity_id: "{{ target_entity_id }}"
                variables:
                  target_entity_id: !lambda |-
                    int detail_index = id(normal_device_detail_index);
                    if (detail_index < 0) detail_index = 0;
                    if (detail_index > 19) detail_index = 19;
                    return id(ui_presenter)->get_normal_device_entity_id(detail_index);
            - script.execute: show_normal_action_sent
          else:
            - if:
                condition:
                  lambda: |-
                    int detail_index = id(normal_device_detail_index);
                    if (detail_index < 0) detail_index = 0;
                    if (detail_index > 19) detail_index = 19;
                    const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
                    return !entity_id.empty() && !is_local_hmi_gpio_switch_entity_id(entity_id);
                then:
                  - homeassistant.service:
                      service: switch.toggle
                      data_template:
                        entity_id: "{{ target_entity_id }}"
                      variables:
                        target_entity_id: !lambda |-
                          int detail_index = id(normal_device_detail_index);
                          if (detail_index < 0) detail_index = 0;
                          if (detail_index > 19) detail_index = 19;
                          return id(ui_presenter)->get_normal_device_entity_id(detail_index);

                  - script.execute: show_normal_action_sent

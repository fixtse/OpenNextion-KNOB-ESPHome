  - id: emit_normal_dimming_light_event
    mode: restart
    parameters:
      detail_index: int
      brightness_pct: int
      is_on: bool
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_BRIGHTNESS, is_on, brightness_pct);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          int brightness = std::clamp(brightness_pct, 0, 100);
          ESP_LOGI("normal_mode", "dimming light direct control: index=%d brightness=%d state=%s",
                   index, brightness, is_on ? "ON" : "OFF");
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - if:

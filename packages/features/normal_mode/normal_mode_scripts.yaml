  - id: refresh_normal_media_progress
    then:
      - lambda: |-
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          const bool visible = id(normal_device_detail_active) && !id(screen_off_state) &&
                               !onx_playlist::browser.open &&
                               id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
                               entity.rfind("media_player.", 0) == 0 && detail != nullptr;
          if (!visible) { lv_obj_add_flag(id(normal_media_progress_arc), LV_OBJ_FLAG_HIDDEN); return; }
          const auto now = id(ha_time).now();
          // ESPHome wall time is whole seconds; retain the fractional part with millis()
          // so a 100ms refresh never turns into a one-second stepping animation.
          static time_t clock_second = 0;
          static uint32_t clock_changed_ms = 0;
          if (clock_second != now.timestamp) { clock_second = now.timestamp; clock_changed_ms = millis(); }
          const double epoch = now.is_valid() ? static_cast<double>(now.timestamp) +
                               (millis() - clock_changed_ms) / 1000.0 : NAN;
          const auto view = detail->progress.view(millis(), epoch,
              id(normal_ha_api_connected) && id(normal_device_detail_online) && detail->available);
          if (!view.visible) { lv_obj_add_flag(id(normal_media_progress_arc), LV_OBJ_FLAG_HIDDEN); return; }
          lv_obj_clear_flag(id(normal_media_progress_arc), LV_OBJ_FLAG_HIDDEN);
          lv_arc_set_value(id(normal_media_progress_arc), view.permille);
          lv_obj_set_style_arc_color(id(normal_media_progress_arc),
              lv_color_hex(onx_display_settings::current.media_color), LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(normal_media_progress_arc), detail->state == "paused" ? 153 : LV_OPA_COVER, LV_PART_INDICATOR);

  - id: apply_normal_media_style
    then:
      - lambda: |-
          const auto entity=id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail=custom_logic_entity_sub::entity_detail(entity);
          const bool media=id(normal_device_detail_active) &&
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
              entity.rfind("media_player.",0)==0 && detail!=nullptr;
          const bool material=media && onx_display_settings::media_style.material;
          // Reset styling on shared labels before another entity uses this page.
          for(auto *label:{id(normal_media_title),id(normal_media_artist),
              id(normal_automation_detail_action),id(normal_automation_detail_title)}) {
            lv_obj_set_style_bg_opa(label,LV_OPA_TRANSP,0);
            lv_obj_set_style_pad_left(label,0,0);
            lv_obj_set_style_pad_right(label,0,0);
            lv_obj_set_style_pad_top(label,0,0);
            lv_obj_set_style_pad_bottom(label,0,0);
          }
          if(!media)return;
          auto *cover=id(normal_media_cover);
          const int source_width=id(media_cover_image)->get_width();
          const int source_height=id(media_cover_image)->get_height();
          // Cover the full circle, using the shorter dimension to avoid gutters.
          // Classic still fits the entire image into its original 100px area.
          const int dimension=material?std::min(source_width,source_height):std::max(source_width,source_height);
          const int scale=dimension>0?(material?(240*256+dimension-1)/dimension:100*256/dimension):256;
          lv_image_set_pivot(cover,0,0);
          lv_image_set_scale(cover,scale);
          const int width=source_width*scale/256,height=source_height*scale/256;
          lv_obj_align(cover,LV_ALIGN_TOP_LEFT,(240-width)/2,material?(240-height)/2:18);
          lv_obj_set_style_clip_corner(id(normal_automation_detail_shell),true,0);
          lv_obj_set_x(id(normal_automation_detail_icon),0);
          lv_obj_set_y(id(normal_automation_detail_icon),material?30:18);
          if(material)lv_image_set_scale(id(normal_automation_detail_icon),256);
          lv_obj_set_y(id(normal_media_title),material?136:122);
          lv_obj_set_width(id(normal_media_title),196);
          lv_obj_set_height(id(normal_media_title),21);
          lv_obj_set_y(id(normal_media_artist),material?160:144);
          lv_obj_set_width(id(normal_media_artist),196);
          lv_obj_set_height(id(normal_media_artist),20);
          lv_obj_set_y(id(normal_automation_detail_action),material?184:166);
          lv_obj_set_y(id(normal_automation_detail_title),material?206:192);
          lv_obj_set_width(id(normal_automation_detail_action),196);
          lv_obj_set_width(id(normal_automation_detail_title),180);
          lv_obj_set_style_text_font(id(normal_automation_detail_action),
              material?id(fonts_MiSans_Medium_14)->get_lv_font():id(fonts_MiSans_Medium_18)->get_lv_font(),0);
          lv_obj_set_style_text_font(id(normal_automation_detail_title),
              material?id(fonts_MiSans_Medium_14)->get_lv_font():id(fonts_MiSans_Medium_16)->get_lv_font(),0);
          // The pause/transport icon is centered; there is no playback-state label.
          lv_obj_set_x(id(normal_media_transport_overlay),0);
          lv_obj_set_y(id(normal_media_transport_overlay),material?96:44);
          if(material) {
            auto backing=[&](lv_obj_t *label,int maximum) {
              const auto *font=lv_obj_get_style_text_font(label,LV_PART_MAIN);
              lv_point_t size;
              lv_text_get_size(&size,lv_label_get_text(label),font,0,0,LV_COORD_MAX,LV_TEXT_FLAG_NONE);
              lv_obj_set_width(label,std::min(maximum,static_cast<int>(size.x)+12));
              lv_obj_set_height(label,font->line_height+4);
              lv_obj_set_style_pad_left(label,6,0);
              lv_obj_set_style_pad_right(label,6,0);
              lv_obj_set_style_pad_top(label,2,0);
              lv_obj_set_style_pad_bottom(label,2,0);
              lv_obj_set_style_radius(label,7,0);
              lv_obj_set_style_bg_color(label,lv_color_hex(0x14171D),0);
              lv_obj_set_style_bg_opa(label,lv_label_get_text(label)[0]?178:LV_OPA_TRANSP,0);
              lv_label_set_long_mode(label,LV_LABEL_LONG_DOT);
            };
            backing(id(normal_media_title),200);
            backing(id(normal_media_artist),188);
            backing(id(normal_automation_detail_action),160);
            backing(id(normal_automation_detail_title),112);
            lv_obj_move_to_index(cover,0);
          }

  - id: refresh_normal_media_cover
    then:
      - lambda: |-
          // Notification pictures take priority over cosmetic media fetches.
          if(onx_notification::current.visible || onx_notification::image.downloading)return;
          onx_media::artwork_wait_reason.clear();
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          const bool media = id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                             entity.rfind("media_player.", 0) == 0 && detail != nullptr;
          std::string origin = custom_logic::build_ha_http_state_url(id(ha_host).state, "media_player.cover");
          const auto path = origin.find("/api/states/");
          if (path != std::string::npos) origin.resize(path);
          lv_obj_set_y(id(normal_automation_detail_icon), media ? 18 : 40);
          if (media) {
            onx_render::label(id(normal_media_title), onx_media::display_text(onx_media::has_playback(detail->state) ? (detail->media_title.empty() ? detail->state : detail->media_title) : "Nothing playing").c_str());
            onx_render::label(id(normal_media_artist), onx_media::display_text(onx_media::has_playback(detail->state) ? detail->media_artist : "").c_str());
            lv_obj_clear_flag(id(normal_media_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_media_artist), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_media_transport_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_media_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_media_artist), LV_OBJ_FLAG_HIDDEN);
          }
          const bool playable = media && detail->available && id(normal_ha_api_connected) &&
              id(normal_device_detail_online) && !id(screen_off_state) && !id(sleep_mode_state) &&
              !id(ui_presenter)->is_standby_active() && onx_media::has_playback(detail->state);
          const std::string desired = playable ? onx_media::artwork_url(origin, detail->picture) : "";
          if (desired != onx_media::candidate_url) {
            onx_media::candidate_url = desired; onx_media::candidate_ms = millis();
          }
          if (!playable && onx_media::downloading) {
            // Detach the LVGL source before release invalidates the pixel buffer.
            lv_obj_add_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
            onx_render::image(id(normal_media_cover), id(fallback_music_note_img)->get_lv_image_dsc());
            lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            id(media_cover_image)->release();
            onx_media::downloading = false; onx_media::ready_url.clear();
            id(entity_icon_downloader)->set_artwork_busy(false);
            onx_media::last_artwork_end_ms = millis();
            onx_runtime::record("artwork_cancelled", entity);
          }
          const bool ready = !desired.empty() && desired == onx_media::ready_url;
          if (ready) {
            onx_render::image(id(normal_media_cover), id(media_cover_image)->get_lv_image_dsc());
            lv_obj_clear_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_automation_detail_icon), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
          }
          if (desired.empty() || ready || onx_media::downloading ||
              !id(normal_ha_api_connected) || !id(normal_device_detail_online) ||
              id(screen_off_state) || id(ui_presenter)->is_standby_active()) return;
          // Wait for a stable URL and keep concurrent TLS clients off the small
          // internal heap. Cosmetic artwork must not crowd out API/Wi-Fi buffers.
          if (id(media_cover_image)->is_busy() || id(key_btn).state || millis() - onx_media::candidate_ms < 750 ||
              millis() - onx_media::last_artwork_end_ms < 1000 || id(entity_icon_downloader)->busy()) return;
          if (!id(media_cover_image)->memory_ready()) {
            onx_media::artwork_wait_reason = "waiting_for_memory";
            return;
          }
          if (desired == onx_media::requested_url && millis() - onx_media::requested_ms < 60000) return;
          // Hidden LVGL widgets still retain their source. Detach it explicitly.
          onx_render::image(id(normal_media_cover), id(fallback_music_note_img)->get_lv_image_dsc());
          lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          onx_media::ready_url.clear();
          onx_media::requested_url = desired;
          onx_media::requested_ms = millis();
          onx_media::downloading = true;
          id(media_cover_image)->set_url(desired);
          onx_runtime::record("artwork_start", entity);
          id(entity_icon_downloader)->set_artwork_busy(true);
          // The local OnlineImage implementation starts only a worker here.
          id(media_cover_image)->update();

  - id: emit_normal_media_track
    parameters:
      detail_index: int
      previous: bool
    then:
      - if:
          condition:
            lambda: |-
              const auto *detail = custom_logic_entity_sub::entity_detail(id(ui_presenter)->get_normal_device_entity_id(detail_index));
              return detail != nullptr && detail->available && onx_media::can_skip(detail->state, detail->features, previous) &&
                     id(normal_device_detail_active) && id(normal_device_detail_online) &&
                     id(normal_ha_api_connected) && id(normal_device_detail_index) == detail_index &&
                     !id(screen_off_state) && !id(ui_presenter)->is_standby_active() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(ui_presenter)->get_normal_device_entity_id(detail_index).rfind("media_player.", 0) == 0;
          then:
            - if:
                condition:
                  lambda: return previous;
                then:
                  - homeassistant.service:
                      service: media_player.media_previous_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                  - script.execute: show_normal_action_sent
                else:
                  - homeassistant.service:
                      service: media_player.media_next_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                  - script.execute: show_normal_action_sent
            - lambda: |-
                onx_media::transport.show(id(ui_presenter)->get_normal_device_entity_id(detail_index), previous, millis());
            - script.execute: refresh_normal_media_overlay

  - id: emit_normal_playlist_action
    parameters:
      action: string
    then:
      - if:
          condition:
            lambda: return id(normal_ha_api_connected) && onx_playlist::action_valid(action) && action.rfind("automation.", 0) == 0;
          then:
            - homeassistant.service:
                service: automation.trigger
                data:
                  entity_id: !lambda return action;
                  skip_condition: "false"
            - script.execute: show_normal_action_sent
      - if:
          condition:
            lambda: return id(normal_ha_api_connected) && onx_playlist::action_valid(action) && action.rfind("script.", 0) == 0;
          then:
            - homeassistant.service:
                service: script.turn_on
                data:
                  entity_id: !lambda return action;

            - script.execute: show_normal_action_sent
  - id: refresh_normal_playlist
    then:
      - lambda: |-
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity);
          auto &browser = onx_playlist::browser;
          const bool active = list != nullptr && id(normal_device_detail_active) &&
              id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              !id(screen_off_state) && !id(sleep_mode_state) && id(normal_device_detail_online) && id(normal_ha_api_connected);
          if (!active || (browser.open && browser.entity != entity)) browser.clear();
          const uint32_t held = millis() - id(key_press_started_ms);
          const bool holding = active && id(key_btn).state && !id(key_long_press_handled) &&
              !id(detail_long_press_exit_fired) && held >= 150;
          if (!active || (!browser.open && !holding)) {
            lv_obj_add_flag(id(normal_playlist_overlay), LV_OBJ_FLAG_HIDDEN); return;
          }
          // The menu and its hold cue own the foreground, even if playback
          // feedback changes before the next transport refresh.
          lv_obj_add_flag(id(normal_media_transport_overlay), LV_OBJ_FLAG_HIDDEN);
          if (lv_obj_has_flag(id(normal_playlist_overlay), LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_clear_flag(id(normal_playlist_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(normal_playlist_overlay));
          }
          if (holding) lv_obj_add_flag(id(normal_playlist_roller)->obj, LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(normal_playlist_roller)->obj, LV_OBJ_FLAG_HIDDEN);
          if (holding) {
            lv_obj_clear_flag(id(normal_playlist_hint),LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_playlist_rows), LV_OBJ_FLAG_HIDDEN);
            const bool ready = held >= onx_playlist::OPEN_MS;
            onx_render::label(id(normal_playlist_heading), ready ? "Release now" : "Keep holding");
            onx_render::label(id(normal_playlist_rows), ready ? (browser.open ? "Return to player" : "Open playlists") : "Playlist menu");
            onx_render::label(id(normal_playlist_hint), ready ? "Hold longer: back" : "Wait for the cue");
            lv_obj_clear_flag(id(normal_playlist_hold_bar), LV_OBJ_FLAG_HIDDEN);
            lv_bar_set_value(id(normal_playlist_hold_bar), std::min<uint32_t>(100, held * 100 / onx_playlist::OPEN_MS), LV_ANIM_OFF);
            lv_obj_set_style_bg_color(id(normal_playlist_hold_bar), lv_color_hex(ready ? 0x62D49B : 0x62B0FF), LV_PART_INDICATOR);
          } else {
            browser.selected = std::clamp(browser.selected, 0, static_cast<int>(list->count)-1);
            const int i = browser.selected;
            std::string options;
            for(size_t j=0;j<list->count;++j) {
              if(j)options+="\n";
              options+=onx_media::display_text(list->entries[j].name);
            }
            auto *roller=id(normal_playlist_roller)->obj;
            static lv_obj_t *styled_roller=nullptr;
            if(styled_roller!=roller) {
              onx_render::settings_roller(roller,id(fonts_MiSans_Medium_16)->get_lv_font(),
                  id(fonts_MiSans_Medium_18)->get_lv_font(),false);
              styled_roller=roller;
            }
            if(options!=lv_roller_get_options(roller))lv_roller_set_options(roller,options.c_str(),LV_ROLLER_MODE_NORMAL);
            if(lv_roller_get_selected(roller)!=i)lv_roller_set_selected(roller,i,LV_ANIM_OFF);
            onx_render::label(id(normal_playlist_heading), "Playlists");
            lv_obj_add_flag(id(normal_playlist_rows), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_playlist_hint),LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_playlist_hold_bar), LV_OBJ_FLAG_HIDDEN);
          }

  - id: show_normal_action_sent
    then:
      - lambda: |-
          if (!id(normal_ha_api_connected) || !id(normal_device_detail_active)) return;
          onx_action_feedback::sent(id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)), millis());
          id(refresh_normal_action_feedback).execute();

  - id: refresh_normal_action_feedback
    then:
      - lambda: |-
          const auto selected = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          const bool active = id(normal_device_detail_active) && !id(screen_off_state) && !id(sleep_mode_state) &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              onx_action_feedback::active(selected, millis());
          if (!active) {
            lv_obj_add_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN);
            if (onx_action_feedback::visible) onx_action_feedback::clear();
            return;
          }
          if (lv_obj_has_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN)) {
            lv_obj_clear_flag(id(normal_action_feedback), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(normal_action_feedback));
          }

  # HA evaluates these templates against its authoritative target and capability data.
  - id: adjust_normal_climate_temperature
    mode: restart
    parameters:
      direction: int
    then:
      - if:
          condition:
            lambda: |-
              if (!id(normal_knob_event_pass) || id(screen_off_state) ||
                  !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
                  id(standby_wakeup_pending) || id(sleep_wakeup_pending) || id(key_btn).state ||
                  !id(normal_device_detail_active) ||
                  id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
                  !id(normal_device_detail_online) || !id(normal_ha_api_connected)) return false;
              const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
              auto *detail = custom_logic_entity_sub::entity_detail(entity);
              return entity.rfind("climate.", 0) == 0 && detail != nullptr &&
                     (std::isfinite(custom_logic_entity_sub::detail_number(detail->target)) ||
                      (std::isfinite(custom_logic_entity_sub::detail_number(detail->low)) &&
                       std::isfinite(custom_logic_entity_sub::detail_number(detail->high)) &&
                       custom_logic_entity_sub::detail_number(detail->low) <= custom_logic_entity_sub::detail_number(detail->high))) &&
                     std::isfinite(detail->minimum) && std::isfinite(detail->maximum) &&
                     detail->minimum <= detail->maximum;
          then:
            - if:
                condition:
                  lambda: |-
                    auto *detail = custom_logic_entity_sub::entity_detail(id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)));
                    return detail != nullptr && std::isfinite(custom_logic_entity_sub::detail_number(detail->target));
                then:
                  - homeassistant.service:
                      service: climate.set_temperature
                      data_template:
                        entity_id: "{{ entity }}"
                        temperature: >-
                          {% set step = state_attr(entity, 'target_temp_step') | float(0.5) %}
                          {% set value = state_attr(entity, 'temperature') | float + (direction | int) * (step if step > 0 else 0.5) %}
                          {{ [state_attr(entity, 'max_temp') | float, [state_attr(entity, 'min_temp') | float, value] | max] | min }}
                      variables:
                        entity: !lambda return id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
                        direction: !lambda return direction;
                else:
                  - homeassistant.service:
                      service: climate.set_temperature
                      data_template:
                        entity_id: "{{ entity }}"
                        target_temp_low: >-
                          {% set step = state_attr(entity, 'target_temp_step') | float(0.5) %}
                          {% set lo = state_attr(entity, 'target_temp_low') | float %}
                          {% set hi = state_attr(entity, 'target_temp_high') | float %}
                          {% set delta = [state_attr(entity, 'max_temp') | float - hi, [state_attr(entity, 'min_temp') | float - lo, (direction | int) * (step if step > 0 else 0.5)] | max] | min %}
                          {{ lo + delta }}
                        target_temp_high: >-
                          {% set step = state_attr(entity, 'target_temp_step') | float(0.5) %}
                          {% set lo = state_attr(entity, 'target_temp_low') | float %}
                          {% set hi = state_attr(entity, 'target_temp_high') | float %}
                          {% set delta = [state_attr(entity, 'max_temp') | float - hi, [state_attr(entity, 'min_temp') | float - lo, (direction | int) * (step if step > 0 else 0.5)] | max] | min %}
                          {{ hi + delta }}
                      variables:
                        entity: !lambda return id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
                        direction: !lambda return direction;

  - id: refresh_normal_timer_detail
    mode: restart
    then:
      - lambda: |-
          if (id(screen_off_state) || !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active()) return;
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          if (!custom_logic_entity_sub::is_timer_detail(entity) || detail == nullptr) return;
          onx_timer::View view;
          if (detail->voice_timer) {
            const uint32_t age = millis() - detail->timer_received_ms;
            const bool fresh = detail->state != "active" || age < 5000;
            if (fresh) view = onx_timer::view(detail->state, detail->voice_duration,
                detail->voice_remaining, detail->voice_remaining + 1,
                1.0 + age / 1000.0);
          } else {
            const auto now = id(ha_time).now();
            time_t finish = 0;
            const bool has_finish = custom_logic_entity_sub::parse_ha_datetime_epoch(detail->timer_finishes_at, &finish);
            // Interpolate between HA clock seconds for a smoothly shrinking ring.
            static time_t last_epoch = 0;
            static uint32_t clock_tick_ms = 0;
            if (now.timestamp != last_epoch) {
              last_epoch = now.timestamp;
              clock_tick_ms = millis();
            }
            const double clock = now.is_valid() ? now.timestamp + (millis() - clock_tick_ms) / 1000.0 : 0;
            view = onx_timer::view(detail->state, onx_timer::duration_seconds(detail->timer_duration),
                onx_timer::duration_seconds(detail->timer_remaining), has_finish ? finish : NAN, clock);
          }
          if (!id(normal_ha_api_connected) || !id(normal_device_detail_online)) view.ready = false;
          const std::string text = view.ready ? onx_timer::countdown(view.seconds_left) : "--:--";
          lv_label_set_text(id(normal_timer_detail_countdown), text.c_str());
          const char *status = !view.ready ? "Syncing" : detail->state == "paused" ? "Paused" :
                               detail->state == "ringing" ? "Time is up" : detail->state == "idle" ? "Idle" :
                               view.seconds_left <= 0 ? "Time is up" : "Running";
          lv_label_set_text(id(normal_timer_detail_status), status);
          lv_arc_set_value(id(normal_timer_detail_arc), view.ready ? static_cast<int>(view.fraction * 1000) : 0);
          const bool finished = view.ready && (detail->state == "ringing" || (detail->state == "active" && view.seconds_left <= 0));
          const auto color = detail->state == "paused" ? 0xFFBC66 : finished ? 0xFF855E : 0x62B0FF;
          lv_obj_set_style_arc_color(id(normal_timer_detail_arc), lv_color_hex(color), LV_PART_INDICATOR);
          lv_obj_set_style_text_opa(id(normal_timer_detail_countdown),
              finished ? static_cast<lv_opa_t>(160 + 95 * (0.5 + 0.5 * sin(millis() / 250.0))) : LV_OPA_COVER, 0);

  - id: emit_configured_press_action
    parameters:
      detail_index: int
    then:
      - if:
          condition:
            lambda: return onx_entity_config::action_for_ui(detail_index).rfind("automation.", 0) == 0;
          then:
            - homeassistant.service:
                service: automation.trigger
                data:
                  entity_id: !lambda return onx_entity_config::action_for_ui(detail_index);
                  skip_condition: "false"
      - if:
          condition:
            lambda: return onx_entity_config::action_for_ui(detail_index).rfind("script.", 0) == 0;
          then:
            - homeassistant.service:
                service: script.turn_on
                data:
                  entity_id: !lambda return onx_entity_config::action_for_ui(detail_index);

  - id: adjust_normal_media_volume
    parameters:
      direction: int
    then:
      - if:
          condition:
            lambda: |-
              if (!id(normal_knob_event_pass) || id(screen_off_state) ||
                  !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
                  id(standby_wakeup_pending) || id(sleep_wakeup_pending) || id(key_btn).state ||
                  !id(normal_device_detail_active) || !id(normal_device_detail_online) ||
                  !id(normal_ha_api_connected)) return false;
              const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
              auto *detail = custom_logic_entity_sub::entity_detail(entity);
              return entity.rfind("media_player.", 0) == 0 && detail != nullptr &&
                     std::isfinite(custom_logic_entity_sub::detail_number(detail->volume));
          then:
            - homeassistant.service:
                service: media_player.volume_set
                data_template:
                  entity_id: "{{ entity }}"
                  volume_level: >-
                    {{ [1, [0, (state_attr(entity, 'volume_level') | float(0)) + (direction | int) * 0.02] | max] | min }}
                variables:
                  entity: !lambda return id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
                  direction: !lambda return direction;

  - id: refresh_normal_media_cover
    then:
      - lambda: |-
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          const bool media = id(normal_device_detail_active) &&
                             id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                             entity.rfind("media_player.", 0) == 0 && detail != nullptr;
          std::string origin = custom_logic::build_ha_http_state_url(id(ha_host).state, "media_player.cover");
          const auto path = origin.find("/api/states/");
          if (path != std::string::npos) origin.resize(path);
          lv_obj_set_y(id(normal_automation_detail_icon), media ? 18 : 40);
          if (media) {
            lv_label_set_text(id(normal_media_title), (detail->media_title.empty() ? detail->state : detail->media_title).c_str());
            lv_label_set_text(id(normal_media_artist), detail->media_artist.c_str());
            lv_obj_clear_flag(id(normal_media_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(normal_media_artist), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_media_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_media_artist), LV_OBJ_FLAG_HIDDEN);
          }
          const std::string desired = media ? onx_media::artwork_url(origin, detail->picture) : "";
          const bool ready = !desired.empty() && desired == onx_media::ready_url;
          if (ready) {
            lv_img_set_src(id(normal_media_cover), id(media_cover_image)->get_lv_image_dsc());
            lv_obj_clear_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_automation_detail_icon), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_media_cover), LV_OBJ_FLAG_HIDDEN);
          }
          if (desired.empty() || ready || onx_media::downloading ||
              !id(normal_ha_api_connected) || !id(normal_device_detail_online) ||
              id(screen_off_state) || id(ui_presenter)->is_standby_active()) return;
          if (desired == onx_media::requested_url && millis() - onx_media::requested_ms < 30000) return;
          // Hide the old descriptor before the downloader replaces its backing buffer.
          lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          lv_image_header_cache_drop(id(media_cover_image)->get_lv_image_dsc());
          onx_media::ready_url.clear();
          onx_media::requested_url = desired;
          onx_media::ha_origin = origin;
          onx_media::requested_ms = millis();
          onx_media::downloading = true;
          id(media_cover_image)->set_url(desired);
          id(media_cover_image)->update();

  - id: emit_normal_media_track
    parameters:
      detail_index: int
      previous: bool
    then:
      - if:
          condition:
            lambda: |-
              return id(normal_device_detail_active) && id(normal_device_detail_online) &&
                     id(normal_ha_api_connected) && id(normal_device_detail_index) == detail_index &&
                     !id(screen_off_state) && !id(ui_presenter)->is_standby_active() &&
                     id(ui_presenter)->is_normal_mode_active() &&
                     id(ui_presenter)->get_normal_device_entity_id(detail_index).rfind("media_player.", 0) == 0;
          then:
            - if:
                condition:
                  lambda: return previous;
                then:
                  - homeassistant.service:
                      service: media_player.media_previous_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);
                else:
                  - homeassistant.service:
                      service: media_player.media_next_track
                      data:
                        entity_id: !lambda return id(ui_presenter)->get_normal_device_entity_id(detail_index);

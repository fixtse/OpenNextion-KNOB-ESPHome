              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: emit_normal_cct_light_event
    mode: restart
    parameters:
      detail_index: int
      color_temperature: int
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_COLOR_TEMPERATURE, true, color_temperature);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          auto light_state = id(app_storage)->normal_device_slot(index).light();
          int cct_min_kelvin = (int) light_state.min_color_temperature_kelvin;
          int cct_max_kelvin = (int) light_state.max_color_temperature_kelvin;
          int cct_kelvin = color_temperature;
          if (cct_min_kelvin > 0 && cct_max_kelvin > 0) {
            if (cct_min_kelvin > cct_max_kelvin) {
              const int tmp = cct_min_kelvin;
              cct_min_kelvin = cct_max_kelvin;
              cct_max_kelvin = tmp;
            }
            cct_kelvin = std::clamp(cct_kelvin, cct_min_kelvin, cct_max_kelvin);
          }
          ESP_LOGI("normal_mode", "light direct control cct: index=%d color_temperature_kelvin=%d",
                   index, cct_kelvin);
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - homeassistant.service:
                service: light.turn_on
                data_template:
                  entity_id: "{{ target_entity_id }}"
                  color_temp_kelvin: "{{ target_color_temperature_kelvin }}"
                variables:
                  target_entity_id: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    return id(ui_presenter)->get_normal_device_entity_id(index);
                  target_color_temperature_kelvin: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    auto light_state = id(app_storage)->normal_device_slot(index).light();
                    int cct_min_kelvin = (int) light_state.min_color_temperature_kelvin;
                    int cct_max_kelvin = (int) light_state.max_color_temperature_kelvin;
                    int cct_kelvin = color_temperature;
                    if (cct_min_kelvin > 0 && cct_max_kelvin > 0) {
                      if (cct_min_kelvin > cct_max_kelvin) {
                        const int tmp = cct_min_kelvin;
                        cct_min_kelvin = cct_max_kelvin;
                        cct_max_kelvin = tmp;
                      }
                      cct_kelvin = std::clamp(cct_kelvin, cct_min_kelvin, cct_max_kelvin);
                    }
                    return cct_kelvin;
      - delay: 935ms
      - lambda: |-
          const int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::flush_normal_light_feedback_window(
              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: emit_normal_rgb_light_event
    mode: restart
    parameters:
      detail_index: int
      rgb_value_pct: int
    then:
      - lambda: |-
          int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::begin_normal_light_feedback_window(
              index, custom_logic::NORMAL_LIGHT_FEEDBACK_RGB, true, rgb_value_pct);
      - delay: 178ms
      - lambda: |-
          int index = detail_index;
          if (index < 0) index = 0;
          if (index > 19) index = 19;
          int rgb_tick = std::clamp(rgb_value_pct, 0, 35);
          int hue = (rgb_tick * 10) % 360;
          int saturation = 100;
          ESP_LOGI("normal_mode", "light direct control rgb: index=%d hue=%d saturation=%d",
                   index, hue, saturation);
      - if:
          condition:
            lambda: |-
              int index = detail_index;
              if (index < 0) index = 0;
              if (index > 19) index = 19;
              return !id(ui_presenter)->get_normal_device_entity_id(index).empty();
          then:
            - homeassistant.service:
                service: light.turn_on
                data_template:
                  entity_id: "{{ target_entity_id }}"
                  hs_color: !lambda |-
                    static char hs_buf[32];
                    int rgb_tick = std::clamp(rgb_value_pct, 0, 35);
                    int hue = (rgb_tick * 10) % 360;
                    int saturation = 100;
                    sprintf(hs_buf, "[%d,%d]", hue, saturation);
                    return hs_buf;
                variables:
                  target_entity_id: !lambda |-
                    int index = detail_index;
                    if (index < 0) index = 0;
                    if (index > 19) index = 19;
                    return id(ui_presenter)->get_normal_device_entity_id(index);
      - delay: 935ms
      - lambda: |-
          const int index = std::clamp(detail_index, 0, 19);
          custom_logic_entity_sub::flush_normal_light_feedback_window(
              index, id(ui_presenter)->get_normal_device_entity_id(index));
      - script.execute: refresh_normal_light_detail_page

  - id: toggle_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          if (!id(normal_device_detail_active)) {
            return;
          }
          const bool new_state = !id(app_storage)->get_normal_ui_device_state(id(normal_device_detail_index));
          if (!id(app_storage)->set_normal_ui_device_state(id(normal_device_detail_index), new_state)) {
            ESP_LOGW("normal_mode", "detail toggled failed: unable to persist state for index=%d", id(normal_device_detail_index));
            return;
          }
          id(normal_device_detail_is_on) = new_state;
          id(hmi_switch_state) = new_state;
          lv_obj_t *sw = id(hmi_gui_switch);
          if (new_state) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          ESP_LOGI("normal_mode", "detail toggled: %s", new_state ? "ON" : "OFF");
      - script.execute: refresh_normal_switch_detail_page

  - id: exit_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          if(onx_media::idle_popup.visible) {
            id(normal_device_selected_index)=onx_media::idle_popup.previous_index;
            onx_media::idle_popup.visible=false;
          }
          if (onx_timer::popup.visible) {onx_timer::popup.visible=false;onx_timer::popup.dismissed=true;}
          if (!id(normal_device_detail_active)) {
            return;
          }
          custom_logic_entity_sub::cancel_controls();
          id(normal_device_detail_active) = false;
          id(normal_device_detail_kind) = NORMAL_DEVICE_DETAIL_KIND_NONE;
          id(normal_page_index) = 0;
          id(normal_detail_exit_switch_ready) = false;
          id(normal_detail_exit_light_ready) = false;
          id(normal_device_detail_curtain_adjust_active) = false;
          id(normal_device_detail_curtain_adjust_pending) = false;
          id(normal_detail_light_mode_adjusting) = false;
          id(normal_detail_light_mode_rotated) = false;
          id(normal_detail_light_mode) = 0;
          id(normal_detail_light_mode_count) = 0;
          id(normal_automation_press_feedback_active) = false;
          id(normal_detail_exit_settings_ready) = false;
          id(normal_detail_exit_allowed) = false;
          id(key_long_press_handled) = true;
          id(normal_clear_wifi_allowed) = true;
          id(normal_device_detail_online) = true;
          ESP_LOGI("normal_mode", "detail closed");
      - script.execute:
          id: show_normal_device_entry_page
          direction: 0

  - id: adjust_normal_entity_control
    parameters:
      direction: int
    then:
      - lambda: |-
          if (!id(normal_knob_event_pass) || id(screen_off_state) ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
              id(standby_wakeup_pending) || id(sleep_wakeup_pending) ||
              !id(normal_device_detail_active) || id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION || !id(normal_device_detail_online) ||
              !id(normal_ha_api_connected) || id(detail_long_press_exit_fired)) return;
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          if (entity.rfind("weather.", 0) == 0) {
            auto *d = custom_logic_entity_sub::entity_detail(entity);
            if (!d) return;
            const int count = 3 + d->forecast_count;
            d->weather_page = (d->weather_page + (direction < 0 ? -1 : 1) + count) % count;
            if (id(key_btn).state) { id(key_long_press_handled) = true; id(normal_clear_wifi_allowed) = false; }
            id(ui_presenter)->notify_user_activity();
            id(refresh_normal_automation_detail_page).execute();
            return;
          }
          if (onx_playlist::browser.open && onx_playlist::browser.entity == entity) {
            const auto *list = onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity);
            if (list != nullptr) {
              if (id(key_btn).state) {
                id(key_long_press_handled) = true; id(normal_clear_wifi_allowed) = false;
              } else onx_playlist::browser.rotate(direction, list->count);
              id(ui_presenter)->notify_user_activity();
              id(refresh_normal_playlist).execute();
              return;
            }
          }
          if (!onx_controls::handles(entity)) return;
          if (id(key_btn).state) {
            id(normal_clear_wifi_allowed) = false;
            if (entity.rfind("media_player.", 0) == 0) {
              id(emit_normal_media_track).execute(id(normal_device_detail_index), direction < 0);
            } else onx_controls::cycle(entity, direction);
            id(key_long_press_handled) = true;
          } else {
            onx_controls::rotate(entity, direction);
          }
          id(ui_presenter)->notify_user_activity();
          id(refresh_normal_automation_detail_page).execute();

  - id: queue_normal_gesture
    parameters:
      direction: int
    then:
      - lambda: |-
          const int slot=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index));
          const int kind=onx_gesture::gesture(direction,id(key_btn).state);
          if(!onx_gesture::routes(slot,kind))return;
          onx_gesture::queue(slot,kind,id(normal_knob_applied_value));
          if(id(key_btn).state) {id(key_long_press_handled)=true;id(normal_clear_wifi_allowed)=false;}
          id(ui_presenter)->notify_user_activity();

  - id: dispatch_normal_gesture_queue
    then:
      - lambda: |-
          if(!id(normal_device_detail_active) || !id(normal_ha_api_connected) ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active() ||
              id(screen_off_state) || id(sleep_mode_state) || id(sleep_wakeup_pending) || id(standby_wakeup_pending) ||
              id(mode_manager)->is_provisioning_mode_enabled() || onx_notification::current.visible ||
              onx_timer::popup.visible || onx_playlist::browser.open || id(detail_long_press_exit_fired)) {
            onx_gesture::clear_pending();return;
          }
          if(onx_gesture::pending.empty())return;
          const auto request=onx_gesture::pending.front();onx_gesture::pending.pop_front();
          if(request.slot!=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index))) {
            onx_gesture::clear_pending();return;
          }
          const auto &config=onx_gesture::configs[request.slot];
          auto &state=onx_gesture::states[request.slot];
          state.requested_ms=millis();state.press_request=false;++state.token;
          const auto *detail=custom_logic_entity_sub::entity_detail(config.entity);
          const std::string value=state.received?state.value:!config.feedback[0] && detail?detail->state:"";
          const std::string unit=state.received?state.unit:!config.feedback[0] && detail?detail->unit:"";
          id(emit_normal_gesture).execute(request.slot,request.kind,request.delta,state.token,
              std::string(config.actions[request.kind]),std::string(config.entity),value,unit,config.responses,config.events);

  - id: emit_normal_gesture
    mode: parallel
    max_runs: 8
    parameters:
      slot: int
      kind: int
      delta: int
      token: int
      action: string
      entity: string
      value: string
      unit: string
      responses: bool
      events: bool
    then:
      - if:
          condition:
            lambda: return events;
          then:
            - homeassistant.event:
                event: esphome.knob_gesture
                data:
                  device: !lambda return App.get_name();
                  entity_id: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
      - if:
          condition:
            lambda: return action.rfind("automation.",0)==0;
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda return action;
                  skip_condition: "false"
                data_template:
                  variables: !lambda |-
                    return custom_logic::build_ha_action_variables(entity,delta,onx_gesture::names[kind],kind>=2,value,unit);
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && !responses;
          then:
            - homeassistant.action:
                action: !lambda return action;
                data:
                  knob_entity: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && responses;
          then:
            - homeassistant.action:
                action: !lambda return action;
                data:
                  knob_entity: !lambda return entity;
                  direction: !lambda return std::string(onx_gesture::names[kind]);
                  delta: !lambda return std::to_string(delta);
                  pressed: !lambda return std::string(kind>=2?"true":"false");
                  value: !lambda return value;
                  unit: !lambda return unit;
                capture_response: true
                on_success:
                  - lambda: |-
                      if(slot<0 || slot>=20 || entity!=onx_gesture::configs[slot].entity ||
                          onx_gesture::states[slot].token!=static_cast<uint32_t>(token))return;
                      const auto result=response["response"];
                      if(result["value"].isNull())return;
                      std::string text;
                      if(result["value"].is<const char *>())text=result["value"].as<std::string>();
                      else serializeJson(result["value"],text);
                      onx_gesture::feedback(slot,text,result["unit"] | onx_gesture::states[slot].unit,millis(),true);
                on_error:
                  - lambda: |-
                      if(slot>=0 && slot<20 && entity==onx_gesture::configs[slot].entity &&
                          onx_gesture::configs[slot].popup && onx_gesture::states[slot].token==static_cast<uint32_t>(token)) {
                        onx_gesture::states[slot].notice="Action failed";
                        onx_gesture::states[slot].feedback_ms=millis();
                      }

  - id: refresh_normal_gesture_feedback
    then:
      - lambda: |-
          const int slot=onx_entity_config::gesture_slot_for_ui(id(normal_device_detail_index));
          const bool active=slot>=0 && id(normal_device_detail_active) && id(normal_ha_api_connected) &&
              id(ui_presenter)->is_normal_mode_active() && !id(ui_presenter)->is_standby_active() &&
              !id(screen_off_state) && !id(sleep_mode_state) && !onx_notification::current.visible && !onx_timer::popup.visible;
          if(!active || !onx_gesture::states[slot].feedback_ms || millis()-onx_gesture::states[slot].feedback_ms>=1500) {
            lv_obj_add_flag(id(normal_gesture_feedback),LV_OBJ_FLAG_HIDDEN);return;
          }
          const auto &state=onx_gesture::states[slot];
          const auto text=state.notice.empty()?state.value+(state.unit.empty()?"":" "+state.unit):state.notice;
          onx_render::label(id(normal_gesture_feedback_text),text.c_str());
          lv_obj_clear_flag(id(normal_gesture_feedback),LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(normal_gesture_feedback));

  - id: refresh_normal_message_popup
    then:
      - lambda: |-
          auto &message=onx_notification::current;
          auto &picture=onx_notification::image;
          const uint32_t now_ms=millis();
          auto release_picture=[&]() {
            // Detach LVGL before freeing pixels, even if the popup is hidden.
            lv_obj_add_flag(id(normal_message_image),LV_OBJ_FLAG_HIDDEN);
            onx_render::image(id(normal_message_image),id(fallback_music_note_img)->get_lv_image_dsc());
            lv_image_cache_drop(id(notification_image)->get_lv_image_dsc());
            lv_image_header_cache_drop(id(notification_image)->get_lv_image_dsc());
            id(notification_image)->release();
            picture.attempted=picture.downloading=picture.ready=false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
          };
          if(picture.revision!=message.revision) {
            release_picture();
            picture={};picture.revision=message.revision;
          }
          const auto now=id(ha_time).now();
          const bool sleep_due=now.is_valid() && id(ui_presenter)->should_enter_sleep_mode(now.hour,now.minute);
          const bool available=id(ui_presenter)->is_normal_mode_active() &&
              !id(mode_manager)->is_provisioning_mode_enabled() && !id(sleep_mode_state) &&
              !id(screen_off_state) && !sleep_due && !onx_timer::popup.visible;
          if(!available)message.suspend(now_ms);
          if(!available || !message.display(now_ms)) {
            if(!message.pending && (picture.attempted || picture.ready)) {
              release_picture();picture={};picture.revision=message.revision;
            }
            lv_obj_add_flag(id(normal_message_overlay),LV_OBJ_FLAG_HIDDEN);return;
          }
          if(!message.image_url.empty() && !picture.ready && !picture.failed) {
            if(!picture.waiting) {picture.waiting=true;picture.started_ms=now_ms;}
            if(now_ms-picture.started_ms>=8000) {
              release_picture();picture.failed=true;
            } else if(!picture.attempted && !id(notification_image)->is_busy() &&
                !onx_media::downloading && !id(media_cover_image)->is_busy() &&
                !id(entity_icon_downloader)->busy() && id(notification_image)->memory_ready()) {
              picture.attempted=picture.downloading=true;
              id(notification_image)->set_source_pixel_limit(1024*1024);
              id(notification_image)->set_url(message.image_url);
              id(entity_icon_downloader)->set_artwork_busy(true);
              id(notification_image)->update();
            }
          }
          if(picture.failed && picture.attempted && !picture.downloading)release_picture();
          static uint32_t rendered_revision=0;
          static bool rendered_image=false;
          if(rendered_revision!=message.revision || rendered_image!=picture.ready) {
            const bool with_image=picture.ready;
            lv_obj_set_y(id(normal_message_title),with_image?40:43);
            lv_obj_set_height(id(normal_message_title),with_image?24:44);
            lv_obj_set_style_text_font(id(normal_message_title),with_image?
                id(fonts_MiSans_Medium_16)->get_lv_font():id(fonts_MiSans_Medium_18)->get_lv_font(),0);
            lv_label_set_long_mode(id(normal_message_title),with_image?LV_LABEL_LONG_DOT:LV_LABEL_LONG_WRAP);
            lv_obj_set_y(id(normal_message_body),with_image?138:94);
            lv_obj_set_height(id(normal_message_body),with_image?64:110);
            lv_obj_set_style_text_font(id(normal_message_text),with_image?
                id(fonts_MiSans_Medium_14)->get_lv_font():id(fonts_MiSans_Medium_16)->get_lv_font(),0);
            if(with_image) {
              onx_render::image(id(normal_message_image),id(notification_image)->get_lv_image_dsc());
              lv_obj_clear_flag(id(normal_message_image),LV_OBJ_FLAG_HIDDEN);
            } else lv_obj_add_flag(id(normal_message_image),LV_OBJ_FLAG_HIDDEN);
            onx_render::label(id(normal_message_title),message.title.c_str());
            onx_render::label(id(normal_message_text),message.body.c_str());
            lv_obj_update_layout(id(normal_message_body));
            lv_obj_scroll_to_y(id(normal_message_body),0,LV_ANIM_OFF);
            rendered_revision=message.revision;rendered_image=with_image;
          }
          if(id(key_btn).state) {
            // An arriving popup also takes ownership of an already-held press.
            // Keep it consumed through release if the popup disappears first.
            onx_notification::press_consumed=true;
            id(key_pressed)=false;
            id(normal_clear_wifi_allowed)=false;
            id(key_long_press_handled)=true;
          }
          onx_navigation::hide();
          lv_obj_clear_flag(id(normal_message_overlay),LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(normal_message_overlay));

  - id: scroll_normal_message
    parameters:
      direction: int
    then:
      - lambda: |-
          if(!onx_notification::current.visible)return;
          auto *body=id(normal_message_body);
          const int maximum=std::max(0,static_cast<int>(lv_obj_get_scroll_y(body)+lv_obj_get_scroll_bottom(body)));
          lv_obj_scroll_to_y(body,std::clamp(static_cast<int>(lv_obj_get_scroll_y(body))+direction*32,0,maximum),LV_ANIM_ON);
          id(ui_presenter)->notify_user_activity();

  - id: check_normal_idle_media_popup
    then:
      - lambda: |-
          if(onx_notification::current.visible)return;
          auto &popup=onx_media::idle_popup;
          const auto now=id(ha_time).now();
          const bool sleep_due=now.is_valid() && id(ui_presenter)->should_enter_sleep_mode(now.hour,now.minute);
          const bool allowed=onx_display_settings::idle.media && id(normal_ha_api_connected) &&
              id(ui_presenter)->is_normal_mode_active() && !id(mode_manager)->is_provisioning_mode_enabled() &&
              !id(screen_off_state) && !id(sleep_mode_state) && !sleep_due && !onx_timer::popup.visible;
          const auto timeout=id(app_storage)->get_standby_timeout_ms();
          if(popup.visible && id(ui_presenter)->user_idle_ms()<timeout) {
            // Interaction takes ownership of the player as a regular detail view.
            popup.visible=false;return;
          }
          auto playing=[&](int index) {
            if(index<0 || index>=id(normal_device_count))return false;
            const auto entity=id(ui_presenter)->get_normal_device_entity_id(index);
            const auto *detail=custom_logic_entity_sub::entity_detail(entity);
            return entity.rfind("media_player.",0)==0 && detail && detail->received && detail->available && detail->state=="playing";
          };
          int candidate=playing(id(normal_device_selected_index))?id(normal_device_selected_index):-1;
          if(candidate<0)for(int i=0;i<id(normal_device_count) && i<20;++i)if(playing(i)) {candidate=i;break;}
          if(popup.visible) {
            if(!allowed || candidate<0) {
              popup.visible=false;
              id(normal_device_selected_index)=popup.previous_index;
              id(exit_normal_switch_detail).execute();
              return;
            }
            if(candidate!=id(normal_device_detail_index)) {
              id(normal_device_selected_index)=candidate;
              id(enter_normal_switch_detail).execute();
            }
            return;
          }
          const auto current_entity=id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          const bool manual_player=id(normal_device_detail_active) &&
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_AUTOMATION && current_entity.rfind("media_player.",0)==0;
          if(!allowed || candidate<0 || (id(normal_device_detail_active) && !manual_player) || !id(ui_presenter)->is_standby_active())return;
          popup.previous_index=id(normal_device_selected_index);
          popup.visible=true;
          id(normal_device_selected_index)=candidate;
          id(enter_normal_switch_detail).execute();

  - id: check_normal_timer_popup
    then:
      - lambda: |-
          if (onx_timer::popup.visible && !id(normal_ha_api_connected)) {
            onx_timer::popup.visible=false;
            id(normal_device_selected_index)=onx_timer::popup.previous_index;
            id(exit_normal_switch_detail).execute();
          }
          if (!id(ui_presenter)->is_normal_mode_active() || !id(normal_ha_api_connected) ||
              id(mode_manager)->is_provisioning_mode_enabled() || id(sleep_mode_state) || id(screen_off_state)) return;
          int candidate=-1; double soonest=INFINITY;
          const auto now = id(ha_time).now();
          bool popup_still_active=false;
          for (int i=0;i<id(normal_device_count) && i<20;++i) {
            const auto entity=id(ui_presenter)->get_normal_device_entity_id(i);
            auto *d=custom_logic_entity_sub::entity_detail(entity);
            if (!d || !d->received || !d->available || !custom_logic_entity_sub::is_timer_detail(entity)) continue;
            if (d->voice_timer && d->state=="active" && millis()-d->timer_received_ms>=5000) continue;
            time_t finish=0;
            const bool has_finish=custom_logic_entity_sub::parse_ha_datetime_epoch(d->timer_finishes_at, &finish) ||
                (d->state=="idle" && custom_logic_entity_sub::parse_ha_datetime_epoch(d->timer_last_finish, &finish));
            if (d->state=="idle" && has_finish && now.is_valid() && now.timestamp<finish) d->timer_last_finish.clear();
            const bool completed=d->state=="idle" && has_finish && now.is_valid() && now.timestamp>=finish && now.timestamp-finish<10;
            if (d->state!="active" && d->state!="paused" && d->state!="ringing" && !completed) continue;
            if (onx_timer::popup.entity==entity) popup_still_active=true;
            const double left=(d->state=="ringing" || completed) ? -1 : d->state=="paused" ? 1e12 :
                d->voice_timer ? std::max(0.0, d->voice_remaining-(millis()-d->timer_received_ms)/1000.0) : has_finish && now.is_valid() ? double(finish)-now.timestamp : 1e11;
            if (left<soonest) {soonest=left;candidate=i;}
          }
          if (onx_timer::popup.visible) {
            if (!popup_still_active) {
              onx_timer::popup.visible=false;
              id(normal_device_selected_index)=onx_timer::popup.previous_index;
              id(exit_normal_switch_detail).execute();
            }
            return;
          }
          if (candidate<0) {onx_timer::popup.dismissed=false;return;}
          if (!onx_timer::popup_due(id(ui_presenter)->user_idle_ms(), id(normal_device_detail_active), onx_timer::popup.dismissed)) return;
          // Never replace a settings page or an explicitly sleeping screen.
          if (id(normal_device_detail_active) && id(normal_device_detail_kind)!=NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) return;
          if(onx_media::idle_popup.visible) {
            id(normal_device_selected_index)=onx_media::idle_popup.previous_index;
            onx_media::idle_popup.visible=false;
          }
          onx_timer::popup.previous_index=id(normal_device_selected_index);
          onx_timer::popup.entity=id(ui_presenter)->get_normal_device_entity_id(candidate);
          onx_timer::popup.visible=true;
          if (id(ui_presenter)->is_standby_active()) id(exit_standby_mode).execute();
          id(normal_device_selected_index)=candidate;
          id(enter_normal_switch_detail).execute();

  - id: refresh_normal_timer_detail
    mode: restart
    then:
      - lambda: |-
          if (id(screen_off_state) || !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
              !id(ui_presenter)->is_normal_mode_active() || id(ui_presenter)->is_standby_active()) return;
          const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
          auto *detail = custom_logic_entity_sub::entity_detail(entity);
          if (!custom_logic_entity_sub::is_timer_detail(entity) || detail == nullptr) return;
          onx_timer::View view;
          if (detail->voice_timer) {
            const uint32_t age = millis() - detail->timer_received_ms;
            const bool fresh = detail->state != "active" || age < 5000;
            if (fresh) view = onx_timer::view(detail->state, detail->voice_duration,
                detail->voice_remaining, detail->voice_remaining + 1,
                1.0 + age / 1000.0);
          } else {
            const auto now = id(ha_time).now();
            time_t finish = 0;
            const bool has_finish = custom_logic_entity_sub::parse_ha_datetime_epoch(detail->timer_finishes_at, &finish) ||
                (detail->state == "idle" && custom_logic_entity_sub::parse_ha_datetime_epoch(detail->timer_last_finish, &finish));
            // Interpolate between HA clock seconds for a smoothly shrinking ring.
            static time_t last_epoch = 0;
            static uint32_t clock_tick_ms = 0;
            if (now.timestamp != last_epoch) {
              last_epoch = now.timestamp;
              clock_tick_ms = millis();
            }
            const double clock = now.is_valid() ? now.timestamp + (millis() - clock_tick_ms) / 1000.0 : 0;
            view = onx_timer::view(detail->state, onx_timer::duration_seconds(detail->timer_duration),
                onx_timer::duration_seconds(detail->timer_remaining), onx_timer::deadline_epoch(has_finish, finish), clock);
          }
          if (!id(normal_ha_api_connected) || !id(normal_device_detail_online)) view.ready = false;
          const std::string text = view.ready ? onx_timer::countdown(view.seconds_left) : "--:--";
          lv_label_set_text(id(normal_timer_detail_countdown), text.c_str());
          const char *status = !view.ready ? "Syncing" : detail->state == "paused" ? "Paused" :
                               detail->state == "ringing" ? "Time is up" : detail->state == "idle" ? "Idle" :
                               view.seconds_left <= 0 ? "Time is up" : "Running";
          lv_label_set_text(id(normal_timer_detail_status), status);
          lv_arc_set_value(id(normal_timer_detail_arc), view.ready ? static_cast<int>(view.fraction * 1000) : 0);
          time_t completed_at=0;
          const auto current_time=id(ha_time).now();
          const bool just_completed=detail->state=="idle" && current_time.is_valid() &&
              custom_logic_entity_sub::parse_ha_datetime_epoch(detail->timer_last_finish, &completed_at) &&
              current_time.timestamp>=completed_at && current_time.timestamp-completed_at<10;
          const bool finished = view.ready && (just_completed || detail->state == "ringing" || (detail->state == "active" && view.seconds_left <= 0));
          if (finished) lv_label_set_text(id(normal_timer_detail_status), "Time is up");
          const auto color = onx_display_settings::current.media_color;
          if (finished) lv_arc_set_value(id(normal_timer_detail_arc), 1000);
          lv_obj_set_style_arc_opa(id(normal_timer_detail_arc), finished && (millis()/350)%2 ? 60 : LV_OPA_COVER, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(normal_timer_detail_arc), lv_color_hex(color), LV_PART_INDICATOR);
          lv_obj_set_style_text_opa(id(normal_timer_detail_countdown),
              finished ? static_cast<lv_opa_t>(160 + 95 * (0.5 + 0.5 * sin(millis() / 250.0))) : LV_OPA_COVER, 0);

  - id: emit_configured_press_action
    parameters:
      detail_index: int
    then:
      - lambda: |-
          const auto entity=id(ui_presenter)->get_normal_device_entity_id(detail_index);
          const auto action=onx_entity_config::action_for_ui(detail_index);
          const int slot=onx_entity_config::gesture_slot_for_ui(detail_index);
          if(!id(normal_ha_api_connected))return;
          bool responses=false;
          uint32_t token=0;
          if(slot>=0 && slot<20) {
            auto &state=onx_gesture::states[slot];
            state.requested_ms=millis();state.press_request=true;token=++state.token;
            state.feedback_ms=0;state.notice.clear();
            responses=onx_gesture::configs[slot].press_responses;
          }
          onx_runtime::record("press_action",entity);
          id(emit_normal_press_action).execute(slot,entity,action,token,responses);

  - id: emit_normal_press_action
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
      entity: string
      action: string
      token: int
      responses: bool
    then:
      - if:
          condition:
            lambda: return action.rfind("automation.",0)==0;
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda return action;
                  skip_condition: "false"
                data_template:
                  variables: !lambda |-
                    return responses ? "{{ dict(knob_entity='"+entity+"') }}" : "{{ dict() }}";
            - script.execute: show_normal_action_sent
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && !responses;
          then:
            - homeassistant.action:
                action: script.turn_on
                data:
                  entity_id: !lambda return action;
            - script.execute: show_normal_action_sent
      - if:
          condition:
            lambda: return action.rfind("script.",0)==0 && responses;
          then:
            - homeassistant.action:
                action: !lambda return action;
                capture_response: true
                on_success:
                  - lambda: |-
                      if(slot<0 || slot>=20 || entity!=onx_gesture::configs[slot].entity ||
                          !onx_gesture::configs[slot].press_responses ||
                          onx_gesture::states[slot].token!=static_cast<uint32_t>(token))return;
                      const auto result=response["response"];
                      if(result["value"].isNull())return;
                      std::string text;
                      if(result["value"].is<const char *>())text=result["value"].as<std::string>();
                      else serializeJson(result["value"],text);
                      onx_gesture::feedback(slot,text,result["unit"] | "",millis(),true);
                      id(refresh_normal_gesture_feedback).execute();
                on_error:
                  - lambda: |-
                      if(slot<0 || slot>=20 || entity!=onx_gesture::configs[slot].entity ||
                          !onx_gesture::configs[slot].press_responses ||
                          onx_gesture::states[slot].token!=static_cast<uint32_t>(token))return;
                      onx_gesture::states[slot].notice="Action failed";
                      onx_gesture::states[slot].feedback_ms=millis();
                      id(refresh_normal_gesture_feedback).execute();

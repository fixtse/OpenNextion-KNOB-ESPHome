              lv_obj_has_flag(id(normal_playlist_overlay), LV_OBJ_FLAG_HIDDEN) &&
              !lv_obj_has_flag(id(normal_media_title), LV_OBJ_FLAG_HIDDEN);
          onx_media::transport.observe(entity, active);

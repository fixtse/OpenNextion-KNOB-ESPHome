script:
  - id: request_normal_sensor_history
    mode: parallel
    max_runs: 2
    parameters:
      entity: string
    then:
      - if:
          condition:
            lambda: |-
              const int i=onx_sensor_view::index(entity);
              if(i<0 || !onx_sensor_view::configs[i].graph || !id(normal_ha_api_connected))return false;
              auto &s=onx_sensor_view::states[i];
              if(s.requested && millis()-s.requested_ms<300000)return false;
              s.requested=s.pending=true;s.requested_ms=millis();return true;
          then:
            - homeassistant.action:
                action: recorder.get_statistics
                variables:
                  sensor_entity: !lambda return entity;
                data_template:
                  statistic_ids: "{{ [sensor_entity] }}"
                  start_time: "{{ (now() - timedelta(hours=12)).isoformat() }}"
                  period: 5minute
                  types: "{{ ['mean', 'state'] }}"
                capture_response: true
                response_template: !lambda |-
                  return "{% set ns = namespace(points=[]) %}{% for p in response.get('statistics', response).get('"+entity+"', [])[::2][:73] %}{% set y = p.get('mean') if p.get('mean') is not none else p.get('state') %}{% if y is number %}{% set ns.points = ns.points + [dict(t=as_timestamp(p['start']), y=y)] %}{% endif %}{% endfor %}{{ dict(points=ns.points) | to_json }}";
                on_success:
                  - lambda: |-
                      const int i=onx_sensor_view::index(entity);if(i<0)return;
                      auto &s=onx_sensor_view::states[i];s.pending=false;
                      for(JsonObjectConst p:response["response"]["points"].as<JsonArrayConst>())
                        if(p["t"].is<double>()&&p["y"].is<float>())s.sample(p["t"].as<uint32_t>(),p["y"].as<float>());
                      id(refresh_normal_automation_detail_page).execute();
                on_error:
                  - lambda: |-
                      const int i=onx_sensor_view::index(entity);if(i>=0)onx_sensor_view::states[i].pending=false;

  - id: request_normal_weather_forecast
    mode: parallel
    max_runs: 2
    parameters:
      entity: string
      force: bool
    then:
      - if:
          condition:
            lambda: |-
              auto *d = custom_logic_entity_sub::entity_detail(entity);
              if (!d || entity.rfind("weather.", 0) != 0 || !d->available || !id(normal_ha_api_connected)) return false;
              const uint32_t age = millis() - d->forecast_requested_ms;
              if (d->forecast_requested && (age < 20000 || (!force && age < 900000))) return false;
              d->forecast_requested = d->forecast_pending = true;
              d->forecast_requested_ms = millis();
              return true;
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  entity_id: !lambda return entity;
                  type: daily
                capture_response: true
                response_template: !lambda |-
                  // Keep a native mapping: JSON null/true/false prevent HA's native
                  // template parser from recognizing an object and produce a string.
                  return "{% set ns = namespace(days=[]) %}{% for f in response.get('" + entity + "', {}).get('forecast', [])[:5] %}{% set ns.days = ns.days + [dict(date=f.get('datetime',''), condition=f.get('condition',''), high=f.get('temperature'), low=f.get('templow'), rain=f.get('precipitation_probability'))] %}{% endfor %}{{ dict(days=ns.days) }}";
                on_success:
                  - lambda: |-
                      auto *d = custom_logic_entity_sub::entity_detail(entity);
                      if (!d) return;
                      d->forecast_pending = false;
                      d->forecast_count = 0;
                      for (JsonObjectConst day : response["response"]["days"].as<JsonArrayConst>()) {
                        if (d->forecast_count >= 5) break;
                        auto &f = d->forecast[d->forecast_count++];
                        f.date = std::string(day["date"] | "").substr(0, 32);
                        f.condition = std::string(day["condition"] | "").substr(0, 40);
                        auto number = [](JsonVariantConst v) -> std::string {
                          if (v.isNull() || (!v.is<float>() && !v.is<int>())) return "";
                          return onx_detail_view::compact(std::to_string(v.as<float>()));
                        };
                        f.high = number(day["high"]); f.low = number(day["low"]); f.rain = number(day["rain"]);
                      }
                      d->forecast_failed = d->forecast_count == 0;
                      d->weather_page = std::min(d->weather_page, 2 + d->forecast_count);
                      id(refresh_normal_automation_detail_page).execute();
                on_error:
                  - lambda: |-
                      auto *d = custom_logic_entity_sub::entity_detail(entity);
                      if (d) { d->forecast_pending = false; d->forecast_failed = true; }
                      id(refresh_normal_automation_detail_page).execute();

  - id: enter_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = true;
          id(sleep_wakeup_pending) = false;
      - switch.turn_on: ha_screen_off
  - id: exit_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (!id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = false;
          id(sleep_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: exit_standby_mode
    mode: restart
    then:
      - lambda: |-
          id(standby_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: refresh_normal_ha_connection_state
    mode: restart
    then:
      - lambda: |-
          const bool ha_connected =
              id(api_server)->is_connected_with_state_subscription();
          if (id(normal_ha_api_connected) == ha_connected) {
            return;
          }

          id(normal_ha_api_connected) = ha_connected;
          if (!ha_connected) {
            custom_logic_entity_sub::cancel_controls();
            for(auto &secondary:onx_sensor_view::states){secondary.received=false;secondary.available=false;}
            for (auto &detail : custom_logic_entity_sub::entity_details) {
              detail.received = false;
              detail.available = false;
            }
          }
          if (ha_connected) {
            id(normal_ha_added) = true;
          }

          if (ha_connected) {
            lv_obj_clear_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(ui_presenter)->is_normal_mode_active() &&
              !id(ui_presenter)->is_standby_active() &&
              id(normal_page_index) == 0 &&
              !id(normal_device_detail_active)) {
            id(show_normal_device_entry_page).execute(0);
          }
          id(refresh_normal_device_page).execute();
          id(refresh_normal_switch_detail_page).execute();
          id(refresh_normal_automation_detail_page).execute();
          id(refresh_normal_light_detail_page).execute();
          id(refresh_normal_curtain_detail_page).execute();
  - id: refresh_normal_device_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              id(normal_page_index) != 0 || id(normal_device_detail_active) ||
              id(screen_off_state) || id(sleep_mode_state) || onx_notification::current.visible) {
            onx_navigation::hide();
            lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 20) total = 20;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;

          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          if (!onx_timer::popup.visible) selected = onx_entity_config::carousel_selection(selected,total,1);
          id(normal_device_selected_index) = selected;

          struct EntryWidgets {
            lv_obj_t *icon_switch;
            lv_obj_t *icon_switch_on;
            lv_obj_t *icon_plug;
            lv_obj_t *icon_plug_on;
            lv_obj_t *icon_light;
            lv_obj_t *icon_light_on;
            lv_obj_t *icon_curtain;
            lv_obj_t *icon_settings;
            lv_obj_t *title;
            lv_obj_t *index_icon;
            lv_obj_t *value;
            lv_obj_t *context;
            lv_obj_t *pagination;
          };

          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          auto lower = [](std::string s) {
            for (char &c : s) {
              if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
            }
            return s;
          };

          auto device_title_at = [&](int index) -> std::string {
            const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(index);
            std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
            if (device_title.empty()) {
              device_title = device_entity_id;
            }
            return device_title;
          };

          auto device_type_at = [&](int index) -> std::string {
            return id(ui_presenter)->get_normal_device_type(index);
          };

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };

          auto render_entry = [&](EntryWidgets w, int entry_index) {
            const bool settings_entry = entry_index >= total;
            std::string device_title = settings_entry ? "Settings" : device_title_at(entry_index);
            std::string device_type = settings_entry ? "settings" : device_type_at(entry_index);

            int device_kind = 1;
            if (settings_entry) {
              device_kind = 5;
            } else {
              if (device_type.empty()) device_type = "switch";
              device_type = lower(device_type);
              if (device_type == "switch") {
                device_kind = 1;
              } else if (device_type == "plug" || device_type == "chazuo") {
                device_kind = 3;
              } else if (device_type == "light" || device_type == "liang" ||
                         device_type == "dimming_light" || device_type == "dimmable_light" || device_type == "dimming") {
                device_kind = 2;
              } else if (device_type == "curtain" || device_type == "cover") {
                device_kind = 4;
              } else if (device_type == "automation" || device_type == "sensor" || device_type == "binary_sensor" || device_type == "climate" || device_type == "script" || device_type == "weather" || device_type == "timer" || device_type == "media_player" || device_type == "fan" || device_type == "number" || device_type == "input_number" || device_type == "select" || device_type == "input_select" || device_type == "scene" || device_type == "button" || device_type == "input_button") {
                device_kind = 10;
              }
            }

            if (!settings_entry && device_title.empty()) {
              if (device_kind == 1) {
                device_title = "switch";
              } else if (device_kind == 3) {
                device_title = "plug";
              } else if (device_kind == 4) {
                device_title = "curtain";
              } else if (device_kind == 10) {
                device_title = "automation";
              } else {
                device_title = "light";
              }
            }

            set_hidden(w.icon_switch, !(device_kind == 1 || device_kind == 10));
            set_hidden(w.icon_switch_on, true);
            set_hidden(w.icon_plug, device_kind != 3);
            set_hidden(w.icon_plug_on, true);
            set_hidden(w.icon_light, !(device_kind == 2 || device_kind == 7));
            set_hidden(w.icon_light_on, true);
            set_hidden(w.icon_curtain, device_kind != 4);
            set_hidden(w.icon_settings, device_kind != 5);
            lv_img_set_src(w.icon_switch,
                           device_type == "weather" ? id(standby_weather_icon_partlycloudy_img) :
                           device_kind == 10 ? id(normal_device_automation_img)
                                             : id(normal_device_icon_switch_img));
            if (device_kind == 4 && !settings_entry) {
              const uint8_t curtain_position = id(app_storage)->get_normal_ui_device_position(entry_index);
              if (curtain_position >= 100) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_open_img));
              } else if (curtain_position == 0) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_closed_img));
              } else {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
              }
            } else {
              lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
            }

            if (!settings_entry && (device_kind == 1 || device_kind == 3 || device_kind == 2 || device_kind == 7)) {
              bool local_state = false;
              if (device_kind == 1 && local_hmi_gpio_switch_state(id(ui_presenter)->get_normal_device_entity_id(entry_index), &local_state)) {
                id(app_storage)->set_normal_ui_device_state(entry_index, local_state);
              }
              bool is_on = id(app_storage)->get_normal_ui_device_state(entry_index);
              if (device_kind == 1) {
                set_hidden(w.icon_switch, is_on);
                set_hidden(w.icon_switch_on, !is_on);
              } else if (device_kind == 3) {
                set_hidden(w.icon_plug, is_on);
                set_hidden(w.icon_plug_on, !is_on);
              } else {
                set_hidden(w.icon_light, is_on);
                set_hidden(w.icon_light_on, !is_on);
              }
            }

            if (!settings_entry) {
              for (auto *icon : {w.icon_switch_on, w.icon_plug, w.icon_plug_on, w.icon_light,
                                w.icon_light_on, w.icon_curtain, w.icon_settings}) set_hidden(icon, true);
              set_hidden(w.icon_switch, false);
              id(apply_normal_entity_icon).execute(w.icon_switch,
                  id(ui_presenter)->get_normal_device_entity_id(entry_index), device_type,
                  id(app_storage)->get_normal_ui_device_state(entry_index));
            }
            lv_obj_set_y(w.icon_switch, 62);
            lv_image_set_scale(w.icon_switch, 256);
            lv_obj_set_y(w.title, 151); lv_obj_set_width(w.title, 180); lv_obj_set_height(w.title, 25);
            lv_label_set_long_mode(w.title, LV_LABEL_LONG_DOT);
            const auto entity = settings_entry ? std::string("") : id(ui_presenter)->get_normal_device_entity_id(entry_index);
            if (!settings_entry) {
              const auto view = onx_detail_view::carousel(entity, device_title);
              lv_label_set_text(w.value, view.value.text.c_str());
              lv_obj_set_y(w.value, view.value.y);
              lv_obj_set_style_text_font(w.value,
                  view.value.size == 32 ? id(fonts_MiSans_Medium_32)->get_lv_font() : id(fonts_MiSans_Medium_24)->get_lv_font(), 0);
              set_hidden(w.value, false);
              lv_obj_set_y(w.icon_switch, onx_detail_view::image_object_y(view.icon_y, view.icon_size));
              lv_image_set_scale(w.icon_switch, view.icon_size * 256 / 80);
              lv_obj_set_y(w.title, view.name.y); lv_obj_set_width(w.title, 184); lv_obj_set_height(w.title, 40);
              lv_obj_set_style_text_font(w.title, id(fonts_MiSans_Medium_16)->get_lv_font(), 0);
              lv_label_set_text(w.context, view.context.text.c_str());
              lv_obj_set_y(w.context, view.context.y);
              lv_obj_set_style_text_font(w.context, view.context.size == 24 ? id(fonts_MiSans_Medium_24)->get_lv_font() : id(fonts_MiSans_Medium_14)->get_lv_font(), 0);
              lv_obj_set_height(w.context, view.context.size == 24 ? 30 : 20);
              if (view.icon.empty()) set_hidden(w.icon_switch, true);
              set_hidden(w.context, view.context.text.empty());
              lv_label_set_long_mode(w.title, LV_LABEL_LONG_WRAP);
            }
            lv_obj_set_style_text_align(w.title, LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_align(w.title, LV_ALIGN_TOP_MID, 0, settings_entry ? 151 : onx_detail_view::carousel(entity, device_title).name.y);
            if(settings_entry) lv_label_set_text(w.title, device_title.c_str());
            else {
              const auto view=onx_detail_view::carousel(entity,device_title);
              lv_label_set_text(w.title,view.name.text.c_str());
              lv_obj_set_style_text_font(w.title,view.name.size==14?id(fonts_MiSans_Medium_14)->get_lv_font():id(fonts_MiSans_Medium_16)->get_lv_font(),0);
              lv_obj_set_width(w.title,view.name.width);lv_obj_set_height(w.title,40);
            }
            set_hidden(w.index_icon, true);
            set_hidden(w.pagination,true);
            const int navigator_index=settings_entry?total:entry_index;
            onx_navigation::render(onx_entity_config::carousel_entries(total),navigator_index,
                [&](lv_obj_t *icon,int index,bool active) {
                  if(index==total) {
                    onx_render::image(icon,id(normal_device_icon_settings_img)->get_lv_image_dsc());
                    lv_image_set_scale(icon,18*256/id(normal_device_icon_settings_img)->get_width());
                    lv_obj_set_style_image_recolor(icon,lv_color_hex(active?0x62B0FF:0xFFFFFF),0);
                    lv_obj_set_style_image_recolor_opa(icon,LV_OPA_COVER,0);
                  } else {
                    id(apply_normal_entity_icon).execute(icon,
                        id(ui_presenter)->get_normal_device_entity_id(index),
                        id(ui_presenter)->get_normal_device_type(index),active);
                    lv_image_set_scale(icon,18*256/80);
                  }
                });
          };

          if (total == 0 && selected == 0) {
            onx_navigation::hide();
            set_hidden(id(normal_device_wifi_online_widget), true);
            set_hidden(id(normal_device_wifi_offline_widget), true);
            set_hidden(id(normal_device_homeassistant_online_widget), true);
            set_hidden(id(normal_device_homeassistant_offline_widget), true);
            return;
          }
          set_hidden(id(normal_device_wifi_online_widget), !id(normal_wifi_connected));
          set_hidden(id(normal_device_wifi_offline_widget), id(normal_wifi_connected));
          set_hidden(id(normal_device_homeassistant_online_widget), !id(normal_ha_api_connected));
          set_hidden(id(normal_device_homeassistant_offline_widget), id(normal_ha_api_connected));
          if (selected >= total) {
            render_entry({id(normal_device_settings_icon_switch), id(normal_device_settings_icon_switch_on), id(normal_device_settings_icon_plug), id(normal_device_settings_icon_plug_on), id(normal_device_settings_icon_light), id(normal_device_settings_icon_light_on), id(normal_device_settings_icon_curtain), id(normal_device_settings_icon_settings), id(normal_device_settings_title), id(normal_device_settings_index_icon), nullptr, nullptr, id(normal_device_settings_pagination)}, selected);
          } else {
            switch (selected % 10) {
              case 0:
                render_entry({id(normal_device_0_icon_switch), id(normal_device_0_icon_switch_on), id(normal_device_0_icon_plug), id(normal_device_0_icon_plug_on), id(normal_device_0_icon_light), id(normal_device_0_icon_light_on), id(normal_device_0_icon_curtain), id(normal_device_0_icon_settings), id(normal_device_0_title), id(normal_device_0_index_icon), id(normal_device_0_value), id(normal_device_0_context), id(normal_device_0_pagination)}, selected);
                break;
              case 1:
                render_entry({id(normal_device_1_icon_switch), id(normal_device_1_icon_switch_on), id(normal_device_1_icon_plug), id(normal_device_1_icon_plug_on), id(normal_device_1_icon_light), id(normal_device_1_icon_light_on), id(normal_device_1_icon_curtain), id(normal_device_1_icon_settings), id(normal_device_1_title), id(normal_device_1_index_icon), id(normal_device_1_value), id(normal_device_1_context), id(normal_device_1_pagination)}, selected);
                break;
              case 2:
                render_entry({id(normal_device_2_icon_switch), id(normal_device_2_icon_switch_on), id(normal_device_2_icon_plug), id(normal_device_2_icon_plug_on), id(normal_device_2_icon_light), id(normal_device_2_icon_light_on), id(normal_device_2_icon_curtain), id(normal_device_2_icon_settings), id(normal_device_2_title), id(normal_device_2_index_icon), id(normal_device_2_value), id(normal_device_2_context), id(normal_device_2_pagination)}, selected);
                break;
              case 3:
                render_entry({id(normal_device_3_icon_switch), id(normal_device_3_icon_switch_on), id(normal_device_3_icon_plug), id(normal_device_3_icon_plug_on), id(normal_device_3_icon_light), id(normal_device_3_icon_light_on), id(normal_device_3_icon_curtain), id(normal_device_3_icon_settings), id(normal_device_3_title), id(normal_device_3_index_icon), id(normal_device_3_value), id(normal_device_3_context), id(normal_device_3_pagination)}, selected);
                break;
              case 4:
                render_entry({id(normal_device_4_icon_switch), id(normal_device_4_icon_switch_on), id(normal_device_4_icon_plug), id(normal_device_4_icon_plug_on), id(normal_device_4_icon_light), id(normal_device_4_icon_light_on), id(normal_device_4_icon_curtain), id(normal_device_4_icon_settings), id(normal_device_4_title), id(normal_device_4_index_icon), id(normal_device_4_value), id(normal_device_4_context), id(normal_device_4_pagination)}, selected);
                break;
              case 5:
                render_entry({id(normal_device_5_icon_switch), id(normal_device_5_icon_switch_on), id(normal_device_5_icon_plug), id(normal_device_5_icon_plug_on), id(normal_device_5_icon_light), id(normal_device_5_icon_light_on), id(normal_device_5_icon_curtain), id(normal_device_5_icon_settings), id(normal_device_5_title), id(normal_device_5_index_icon), id(normal_device_5_value), id(normal_device_5_context), id(normal_device_5_pagination)}, selected);
                break;
              case 6:
                render_entry({id(normal_device_6_icon_switch), id(normal_device_6_icon_switch_on), id(normal_device_6_icon_plug), id(normal_device_6_icon_plug_on), id(normal_device_6_icon_light), id(normal_device_6_icon_light_on), id(normal_device_6_icon_curtain), id(normal_device_6_icon_settings), id(normal_device_6_title), id(normal_device_6_index_icon), id(normal_device_6_value), id(normal_device_6_context), id(normal_device_6_pagination)}, selected);
                break;
              case 7:

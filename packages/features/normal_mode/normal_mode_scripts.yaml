  - id: enter_normal_switch_detail
    mode: restart
    then:
      - lambda: |-
          int raw_selected_index = id(normal_device_selected_index);
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 20) total = 20;
          const int settings_index = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
          if (total == 0 && raw_selected_index == 0) {
            ESP_LOGI("normal_mode", "detail entry ignored: empty list page has no detail");
            return;
          }
          int detail_index = raw_selected_index;
          if (detail_index < 0) {
            detail_index = 0;
          }

          std::string device_type = id(ui_presenter)->get_normal_device_type(detail_index);

          auto lower = [](std::string s) {
            for (char &c : s) {
              if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
            }
            return s;
          };
          if (device_type.empty()) {
            device_type = "switch";
          }
          device_type = lower(device_type);
          int detail_kind = NORMAL_DEVICE_DETAIL_KIND_NONE;
          if (raw_selected_index == settings_index) {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_SETTINGS;
          } else if (device_type == "switch") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_SWITCH;
          } else if (device_type == "plug" || device_type == "chazuo") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_PLUG;
          } else if (device_type == "light" || device_type == "liang" ||
                     device_type == "dimming_light" || device_type == "dimmable_light" || device_type == "dimming") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_LIGHT;
          } else if (device_type == "curtain" || device_type == "cover") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_CURTAIN;
          } else if (device_type == "automation" || device_type == "sensor" || device_type == "binary_sensor" || device_type == "climate" || device_type == "script" || device_type == "weather" || device_type == "timer" || device_type == "media_player" || device_type == "fan" || device_type == "number" || device_type == "input_number" || device_type == "select" || device_type == "input_select" || device_type == "scene" || device_type == "button" || device_type == "input_button") {
            detail_kind = NORMAL_DEVICE_DETAIL_KIND_AUTOMATION;
          }
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_NONE) {
            ESP_LOGI("normal_mode",
                     "detail entry ignored: selected item is not a switch, plug, light, curtain or automation");
            return;
          }

          if (detail_index > 19) {
            detail_index = 19;
          }

          id(normal_device_detail_index) = (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS) ? -1 : detail_index;
          onx_navigation::hide();
          id(normal_device_detail_active) = true;
          id(normal_device_detail_kind) = detail_kind;
          id(normal_page_index) = 1;
          // Automatic media/timer entry has no button press to clear the old
          // exit latch. A new detail view must accept wheel input immediately.
          id(detail_long_press_exit_fired) = false;
          id(key_long_press_handled) = true;
          id(normal_detail_exit_switch_ready) = false;
          id(normal_detail_exit_light_ready) = false;
          id(normal_detail_exit_settings_ready) = false;
          id(normal_detail_exit_allowed) = false;
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS) {
            id(normal_settings_selected_index) = 0;
            ESP_LOGI("normal_mode", "settings detail opened");
            lv_scr_load(id(normal_settings_page)->obj);
            id(refresh_normal_settings_detail_page).execute();
            return;
          }
          std::string detail_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };
          bool detail_is_on = id(app_storage)->get_normal_ui_device_state(detail_index);
          const bool is_local_gpio_switch = detail_kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH && local_hmi_gpio_switch_state(detail_entity_id, &detail_is_on);
          if (is_local_gpio_switch) {
            id(app_storage)->set_normal_ui_device_state(detail_index, detail_is_on);
          }
          id(normal_device_detail_is_on) = detail_is_on;
          id(hmi_switch_state) = id(normal_device_detail_is_on);
          id(normal_device_detail_online) = (detail_kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS)
                                                 ? true
                                                 : (is_local_gpio_switch ||
                                                    ((detail_index >= 0 && detail_index < 20)
                                                        ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                                        : true));
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            const int feedback_position = std::clamp((int) id(app_storage)->get_normal_ui_device_position(detail_index), 0, 100);
            id(normal_device_detail_curtain_feedback_position) = feedback_position;
            id(normal_device_detail_curtain_target_position) = feedback_position;
            id(normal_device_detail_curtain_adjust_active) = false;
            lv_scr_load(id(normal_curtain_page)->obj);
            id(refresh_normal_curtain_detail_page).execute();
            return;
          }
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            id(normal_detail_light_mode) = 0;
            auto detail_slot = id(app_storage)->normal_device_slot(detail_index);
            auto light_state = detail_slot.light();
            int mode_count = 0;
            if (light_state.custom_supports_brightness()) mode_count++;
            if (light_state.custom_supports_color_temperature()) mode_count++;
            if (light_state.custom_supports_rgb()) mode_count++;
            id(normal_detail_light_mode_count) = mode_count;
            int cct_value_pct = (int) light_state.color_temperature_step();
            id(normal_light_cct_value_pct) = std::clamp(cct_value_pct, 0, 100);
            int rgb_value_pct = (int) light_state.rgb_tick;
            id(normal_light_rgb_value_pct) = std::clamp(rgb_value_pct, 0, 35);
            id(normal_clear_wifi_allowed) = true;
            ESP_LOGI("normal_mode", "light detail opened for index=%d", detail_index);
            lv_scr_load(id(normal_light_page)->obj);
            id(refresh_normal_light_detail_page).execute();
            return;
          }
          if (detail_kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            const auto weather_entity = id(ui_presenter)->get_normal_device_entity_id(detail_index);
            const int sensor_index=onx_sensor_view::index(weather_entity);
            if(sensor_index>=0 && onx_sensor_view::configs[sensor_index].graph) id(request_normal_sensor_history).execute(weather_entity);
            if (weather_entity.rfind("weather.", 0) == 0) {
              auto *d = custom_logic_entity_sub::entity_detail(weather_entity);
              if (d) d->weather_page = 0;
              id(request_normal_weather_forecast).execute(weather_entity, false);
            }
            id(normal_automation_press_feedback_active) = false;
            ESP_LOGI("normal_mode", "automation detail opened for index=%d", detail_index);
            lv_scr_load(id(normal_automation_page)->obj);
            id(refresh_normal_automation_detail_page).execute();
            return;
          }
          ESP_LOGI("normal_mode", "switch detail opened for index=%d", detail_index);
          lv_scr_load(id(normal_switch_page)->obj);
          id(refresh_normal_switch_detail_page).execute();

  - id: enter_normal_light_detail_mode_switching
